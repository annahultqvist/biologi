body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",Verdana,"Segoe UI",sans-serif;font-size:1.1rem;line-height:1.7;letter-spacing:.01em}
.wrap{max-width:48rem;margin:0 auto;padding:1.2rem 1rem 4rem}
h1{font-size:2rem;line-height:1.2;margin:.4rem 0 .4rem}
h2{font-size:1.4rem;line-height:1.3;margin:0 0 .5rem}
h3{font-size:1.12rem;margin:1rem 0 .3rem}
p{margin:.4rem 0 .8rem}
a{color:inherit}
.soft{color:var(--soft)}
.small{font-size:.95rem}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{font-size:1rem;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:.45rem .9rem;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem}
.btn.main{background:var(--c,#3566B8);border-color:var(--c,#3566B8);color:#fff;font-weight:500}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.count{color:var(--soft);font-size:.95rem;margin-left:auto}
.topnav{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 1rem}
.topnav a{font-size:.95rem;text-decoration:none;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.25rem .8rem}
.topnav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--paper);border-radius:14px;padding:1.1rem 1.2rem;margin:0 0 1.1rem;border:2px solid var(--line)}
.card.k{border-left:10px solid var(--c)}
.hero{border-left:10px solid var(--c);background:var(--paper);border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:1.2rem}
.hero .big{font-size:2.6rem;font-weight:700;line-height:1;color:var(--c)}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:.5rem 0}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.stat{display:flex;gap:1rem;flex-wrap:wrap;font-size:.95rem}
.stat span b{font-size:1.1rem}
.passlist{list-style:none;padding:0;margin:0}
.passlist li{margin:.35rem 0}
.passlist a{display:flex;gap:.7rem;align-items:center;text-decoration:none;padding:.5rem .7rem;border-radius:10px;background:var(--ct);border:2px solid transparent}
.passlist a:hover{border-color:var(--c)}
.passlist .num{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--c);color:#fff;font-weight:700}
.passlist .done .num{background:var(--ok)}
.passlist .meta{font-size:.9rem;color:var(--soft);display:block}
.wk{margin:1.1rem 0 .2rem;font-weight:700}
.step{background:var(--paper);border-radius:14px;padding:1rem 1.2rem;margin:0 0 1rem;border:2px solid var(--line);position:relative}
.step>h2{display:flex;gap:.6rem;align-items:center;font-size:1.25rem}
.step>h2 .sn{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--c);color:#fff;font-size:1rem;display:flex;align-items:center;justify-content:center}
.step.isdone>h2 .sn{background:var(--ok)}
.stepdone{margin-left:auto;font-size:.9rem;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.15rem .7rem;cursor:pointer;min-height:36px}
.stepdone[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tip{background:var(--ct);border-radius:10px;padding:.6rem .9rem;margin:.6rem 0}
textarea,input[type=text],input[type=number],select{font:inherit;font-size:1rem;width:100%;border:2px solid var(--line);border-radius:10px;padding:.5rem .7rem;background:var(--field);color:var(--ink)}
textarea{min-height:5.5rem;resize:vertical;line-height:1.5}
.qc{border-top:2px solid var(--line);padding:.8rem 0}
.qc:first-of-type{border-top:0}

.qc .qt .from{font-size:.8rem;font-weight:400;color:var(--soft);white-space:nowrap}
.ans{background:var(--okt);border-radius:10px;padding:.6rem .9rem;margin:.5rem 0}
.ans p{margin:.2rem 0 .4rem}
.grade{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.grade button{font-size:.95rem;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.2rem .8rem;cursor:pointer;min-height:40px}
.grade button.on.g0{background:var(--ok);border-color:var(--ok);color:#fff}
.grade button.on.g1{background:var(--mid);border-color:var(--mid);color:#fff}
.grade button.on.g2{background:var(--bad);border-color:var(--bad);color:#fff}
.say{font-size:.9rem;border:2px solid var(--line);background:transparent;border-radius:999px;padding:.05rem .65rem;cursor:pointer;flex:none}
.pts{list-style:none;padding:0;margin:.4rem 0}
.pts li{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem .5rem;border-radius:8px;margin:.2rem 0}
.pts li.hit{background:var(--okt)}
.pts li .mk{flex:none;width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--soft);margin-top:.25rem;cursor:pointer;background:transparent;padding:0}
.pts li.hit .mk{background:var(--ok);border-color:var(--ok)}
.exl{display:flex;flex-wrap:wrap;gap:.5rem}
.exl a{text-decoration:none;border:2px solid var(--c);border-radius:10px;padding:.4rem .8rem;background:var(--ct);font-size:1rem}
.exl a.done{border-color:var(--ok)}
.exl a.done::before{content:"✓ ";color:var(--ok);font-weight:700}
/* exercises */
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 .9rem}
.tabs button{font-size:.95rem;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:.3rem .8rem;cursor:pointer;min-height:40px}
.tabs button[aria-pressed="true"]{background:var(--c,#3566B8);border-color:var(--c,#3566B8);color:#fff}
.grp{width:100%;font-size:.88rem;color:var(--soft);margin:.3rem 0 -.1rem}
.answer{display:flex;flex-wrap:wrap;gap:.4rem;min-height:3rem;padding:.5rem;border-radius:10px;border:2px dashed var(--line);margin:.6rem 0}
.answer span{background:var(--c);color:#fff;border-radius:8px;padding:.2rem .7rem;line-height:1.4}
.pool{display:flex;flex-wrap:wrap;gap:.5rem}
.pool button{font-size:1rem;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:.45rem .8rem;cursor:pointer;min-height:44px;text-align:left;line-height:1.35}
.pool button.wrong,.chip.wrong{border-color:var(--bad);animation:shake .3s}
.pool button.right{background:var(--ok);border-color:var(--ok);color:#fff}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.msg{font-weight:500;min-height:1.6rem}
.figscroll{overflow-x:auto;border-radius:10px;background:#fff;border:2px solid var(--line)}
.fig{position:relative;width:100%;margin:0 auto}
.fig img{display:block;width:100%;height:auto}
.zone{position:absolute;border:2px dashed #E08A1E;border-radius:6px;background:rgba(255,248,235,.97);display:flex;align-items:center;justify-content:center;
  font-size:12px;line-height:1.1;color:#1D2B3A;cursor:pointer;padding:0 3px;text-align:center;font-weight:600}
.zone.ok{border:2px solid #2E8B57;background:#E3F4EA;color:#1D5E3A}
.zone.shown{border:2px solid #7D8B99;background:#EEF1F4;color:#4A5A6B}
.zone.no{border-color:#C0392B;background:#FBE3E0;animation:shake .3s}
.picking .zone:not(.ok):not(.shown){background:rgba(232,240,252,.97);border-color:#3878B8}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0 .4rem}
.chip{font-size:1rem;border:2px solid var(--c,#E08A1E);background:var(--paper);color:var(--ink);border-radius:10px;padding:.4rem .75rem;cursor:grab;min-height:44px;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;line-height:1.35}
.chip.sel{background:var(--c,#E08A1E);color:#fff}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem;margin:1rem 0 .4rem}
.bucket{border:2px dashed var(--c);border-radius:12px;padding:.5rem;min-height:6rem;cursor:pointer;background:var(--ct)}
.bucket h3{margin:0 0 .4rem;font-size:1rem;text-align:center}
.bucket .in{font-size:.88rem;background:var(--ok);color:#fff;border-radius:8px;padding:.2rem .5rem;margin:.25rem 0;line-height:1.35}
.bucket.no{border-color:var(--bad);animation:shake .3s}
.picking2 .bucket{border-style:solid}
/* punnett */
.pun{display:grid;gap:4px;margin:.8rem 0;max-width:24rem}
.pun div{border:2px solid var(--line);border-radius:8px;min-height:3rem;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:1.05rem;background:var(--paper)}
.pun .h{background:var(--ct);border-color:var(--c)}
.pun .e{border-color:transparent;background:transparent}
.pun .cell{cursor:pointer;border-style:dashed}
.pun .cell.sel{border-color:#3878B8;border-style:solid;background:rgba(56,120,184,.12)}
.pun .cell.ok{border-color:var(--ok);border-style:solid;background:var(--okt)}
.pun .cell.no{border-color:var(--bad);animation:shake .3s}
.par{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;font-size:1.05rem}
.par b{font-size:1.2rem}

.dna{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;letter-spacing:.05em;word-break:break-word;background:var(--field);border-radius:8px;padding:.4rem .6rem;border:2px solid var(--line)}
.dna mark{background:#F2D06B;color:#1D2B3A;border-radius:3px}
.cods{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.cods label{display:flex;flex-direction:column;gap:.2rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem;align-items:flex-start}
.cods select{width:auto;min-width:8.5rem;font-family:inherit}
.cods select.ok{border-color:var(--ok);background:var(--okt)}
.cods select.no{border-color:var(--bad);background:var(--badt)}
.ctab{overflow-x:auto}
.ctab table{border-collapse:collapse;font-size:.85rem;font-family:ui-monospace,Menlo,Consolas,monospace}
.ctab td,.ctab th{border:1px solid var(--line);padding:.15rem .35rem;vertical-align:top;white-space:nowrap}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;font-size:1rem}
.cmp .lbl{color:var(--soft)}
.aa{display:inline-block;border-radius:6px;padding:0 .3rem;margin:.1rem}
.aa.diff{background:var(--badt);outline:2px solid var(--bad)}
.letters{display:flex;flex-wrap:wrap;gap:.25rem;margin:.5rem 0}
.letters button{min-width:2.2rem;min-height:2.4rem;border:2px solid var(--line);border-radius:6px;background:var(--paper);font-weight:700;cursor:pointer}
.words{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;letter-spacing:.08em}

.ped{background:#fff;border:2px solid var(--line);border-radius:10px;overflow-x:auto}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.9rem;color:var(--soft);margin:.4rem 0}

.canv{border:2px solid var(--line);border-radius:10px;background:#fff;touch-action:none;display:block;width:100%;height:380px}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.tools button{min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--paper);cursor:pointer}
.tools button[aria-pressed="true"]{border-color:var(--ink)}
.kw{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.kw span{border-radius:999px;padding:.1rem .7rem;font-size:.92rem;border:2px solid var(--line)}
.kw span.hit{background:var(--okt);border-color:var(--ok)}
.kw span.miss{background:var(--midt);border-color:var(--mid)}
/* begrepp */
.term{border-left:6px solid var(--c);padding:.5rem .9rem;margin:.6rem 0;background:var(--ct);border-radius:0 10px 10px 0}
.term h3{margin:0;display:flex;gap:.6rem;align-items:center}
.term p{margin:.15rem 0}
.term .exm{color:var(--soft)}
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:.6rem}
.match>div{display:flex;flex-direction:column;gap:.5rem}
.match button{font-size:1rem;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:.5rem .7rem;cursor:pointer;line-height:1.4}
.match button.sel{border-color:#3878B8;background:rgba(56,120,184,.15)}
.match button.done{border-color:var(--ok);background:var(--okt);cursor:default}
.match button.wrong{border-color:var(--bad);animation:shake .3s}
.exq{font-size:1.2rem;font-weight:500;padding:1rem;border-radius:12px;background:var(--ct);margin:.4rem 0 .8rem}
.fcard{min-height:9rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-radius:14px;padding:1.2rem;margin:.6rem 0;cursor:pointer;border:3px solid var(--c);background:var(--ct);font-size:1.25rem;font-weight:500;width:100%;color:var(--ink)}
.fcard small{display:block;font-size:.9rem;color:var(--soft);font-weight:400;margin-top:.5rem}
.note{border:2px dashed var(--line);border-radius:12px;padding:.6rem .9rem;font-size:.98rem;color:var(--soft)}
.sync{font-size:.85rem;color:var(--soft)}
footer{color:var(--soft);font-size:.92rem;margin-top:2rem}
@media (max-width:520px){h1{font-size:1.65rem}.match{grid-template-columns:1fr 1.3fr}.match button{font-size:.9rem}body{font-size:1.05rem}}
.k-his{--c:#3566B8;--ct:rgba(53,102,184,0.1)}.k-del{--c:#8653B8;--ct:rgba(134,83,184,0.1)}.k-arv{--c:#B8661A;--ct:rgba(184,102,26,0.1)}.k-dna{--c:#2F8A5E;--ct:rgba(47,138,94,0.1)}.k-epi{--c:#B8467C;--ct:rgba(184,70,124,0.1)}.k-gte{--c:#13807A;--ct:rgba(19,128,122,0.1)}.k-rep{--c:#4A5A6B;--ct:rgba(74,90,107,0.1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .k-his{--c:#7FA6E8;--ct:rgba(127,166,232,0.14)}:root:not([data-theme="light"]) .k-del{--c:#B48BE3;--ct:rgba(180,139,227,0.14)}:root:not([data-theme="light"]) .k-arv{--c:#F0A452;--ct:rgba(240,164,82,0.14)}:root:not([data-theme="light"]) .k-dna{--c:#5CC08F;--ct:rgba(92,192,143,0.14)}:root:not([data-theme="light"]) .k-epi{--c:#EB86B6;--ct:rgba(235,134,182,0.14)}:root:not([data-theme="light"]) .k-gte{--c:#4FC4B8;--ct:rgba(79,196,184,0.14)}:root:not([data-theme="light"]) .k-rep{--c:#AAB8C5;--ct:rgba(170,184,197,0.14)}:root:not([data-theme="light"]) .btn.main,:root:not([data-theme="light"]) .passlist .num,:root:not([data-theme="light"]) .step>h2 .sn,:root:not([data-theme="light"]) .tabs button[aria-pressed="true"],:root:not([data-theme="light"]) .answer span,:root:not([data-theme="light"]) .chip.sel{color:#161E26}}

<script>
const D={"PASSES": [{"id": "p1", "n": 1, "c": "his", "t": "Genomet och genetikens historia", "pages": "146–153", "week": "v.44", "gissa": ["Barn liknar ofta sina biologiska föräldrar. Men varför blir syskon ändå inte exakt lika varandra?", "Varje barn får hälften av sina kromosomer från vardera biologisk förälder. Vilken av de två kromosomerna i varje par som hamnar i en viss ägg- eller spermiecell är slumpen. Därför får varje syskon sin egen blandning."], "guide": ["Skillnaden mellan kromosom, genom, gen och locus.", "Varför en mutation i en kroppscell inte ärvs, men en mutation i en könscell kan göra det.", "Vilka forskare som tog genetiken framåt: Mendel, Morgan, Avery, Watson, Crick och Franklin. Vad gjorde var och en?"], "bilder": ["s. 147: hur DNA packas till en kromosom", "s. 149: DNA-molekylen", "s. 152: Averys försök med möss"], "punkter": [["Alla kroppsceller har samma genom. Människor skiljer sig bara åt i ungefär en tusendel av genomet.", ["genom", "tusendel|0,1|promille"]], ["En kromosom är en lång DNA-molekyl. Människan har 46 kromosomer.", ["kromosom", "46"]], ["En gen är en del av en kromosom och sitter på en bestämd plats, ett locus.", ["locus|lokus"]], ["De flesta gener är mallar för proteiner, och proteinerna ger oss våra egenskaper.", ["protein"]], ["En mutation i en kroppscell (somatisk mutation) ärvs inte. En mutation i en könscell kan ärvas.", ["somatisk|kroppscell", "könscell"]], ["Mendel visade på 1860-talet med ärtor att egenskaper ärvs på ett regelbundet sätt.", ["mendel"]], ["Avery visade 1944 att det är DNA som bär arvet.", ["avery"]], ["Watson och Crick beskrev dubbelspiralen 1953, med hjälp av Rosalind Franklins upptäckter.", ["watson|crick|franklin|dubbelspiral"]], ["HUGO-projektet kartlade hela människans genom mellan 1990 och 2003.", ["hugo"]]], "fragor": [["Varför liknar barn sina biologiska föräldrar mer än avlägsna släktingar?", ["Barnet har fått hälften av sina kromosomer, och därmed sina gener, från varje biologisk förälder. Avlägsna släktingar delar en mycket mindre del av generna med barnet."]], ["Varför blir barn inte identiska med sina biologiska föräldrar?", ["Varje könscell får bara en av kromosomerna i varje par, och vilken det blir är slumpen. Barnet får alltså en ny kombination av båda föräldrarnas gener. Dessutom kan nya mutationer uppstå och miljön påverkar hur barnet utvecklas."]], ["Vad har alla organismers genom gemensamt?", ["Alla organismers celler bär sin biologiska information i form av DNA (hos vissa virus RNA). Genomet innehåller de instruktioner organismen behöver för att leva. Däremot skiljer sig antalet kromosomer: människan har 46, vete 42 och bakterier oftast 1."]], ["Vad består en kromosom av?", ["En lång DNA-molekyl som är tätt lindad runt proteiner (histoner)."]], ["Hur hänger begreppen genom, kromosom, gen och locus ihop?", ["Genomet är all DNA i en cell. Det är uppdelat på kromosomer. Varje kromosom innehåller många gener, och varje gen sitter på en bestämd plats på kromosomen, ett locus."]], ["Hur hänger begreppen gen och protein ihop?", ["De flesta gener fungerar som mallar för tillverkningen av ett protein: genen kodar för proteinet. Det är proteinerna som ger oss våra egenskaper."]], ["Varför ger inte alla mutationer skador?", ["De flesta mutationer har ingen betydelse, till exempel när de sker i DNA som inte kodar för något. Cellerna kan också reparera många fel. Bara ibland leder en mutation till en sjukdom, och i sällsynta fall blir egenskapen bättre."]], ["Vad skiljer en mutation i en somatisk cell från en mutation i en könscell?", ["En somatisk mutation sker i en vanlig kroppscell. Den påverkar bara individen, till exempel genom att orsaka cancer, och ärvs inte.", "En mutation i en könscell förs vidare till nästa generation. Den skapar variation som det naturliga urvalet kan verka på."]], ["Hur tänkte sig Darwin att ärftligheten fungerade?", ["Darwin lade fram pangenesteorin: alla kroppens celler skickar ut små enheter, gemmulae, till könsorganen. På så sätt skulle hela kroppen bidra till barnets egenskaper. Teorin visade sig vara fel."]], ["Vad upptäckte Mendel genom sina experiment med ärtor?", ["Att egenskaper ärvs på ett regelbundet sätt via anlag (det vi i dag kallar gener). Anlagen förs vidare oförändrade och vissa anlag dominerar över andra. Han kunde beskriva arvet med matematiska förhållanden, till exempel 3:1."]], ["Vad visade Averys försök 1944?", ["Att det är DNA, inte proteiner, som bär arvet. DNA från en avdödad sjukdomsframkallande bakterie kunde göra en ofarlig bakterie sjukdomsframkallande."]], ["Hur vet forskarna att Homo sapiens och neandertalare har fått barn tillsammans?", ["Svante Pääbo har undersökt DNA och visat att många nu levande människor, till exempel i Europa och Asien, bär på gener från neandertalare."]], ["Ta ställning: Ska polisen få använda PKU-registret för att lösa brott?", ["PKU-registret innehåller blodprov från nästan alla som fötts i Sverige sedan 1975. Proverna samlades in för att hitta sjukdomar och för forskning.", "För: polisen kan lösa grova brott, fria oskyldiga och identifiera offer.", "Emot: proverna lämnades för ett annat syfte, det gäller allas integritet, och förtroendet för vården kan minska.", "Ett bra svar väger argumenten och slutar med en egen, motiverad ståndpunkt."]]], "ovn": ["o_tid", "avery", "f_krom", "s_arvs"]}, {"id": "p2", "n": 2, "c": "del", "t": "Cellcykeln, mitos och meios", "pages": "154–159", "week": "v.44", "gissa": ["En kroppscell har 46 kromosomer. Om den bara delade sig rakt av skulle varje ny cell få 23. Och om både ägg och spermie hade 46 skulle barnet få 92. Hur tror du att cellerna löser de här två problemen?", "Före en vanlig celldelning (mitos) kopieras allt DNA, så att båda nya cellerna får 46. Könsceller bildas i stället genom meios, som halverar antalet till 23. Vid befruktningen blir det då 23 + 23 = 46 igen."], "guide": ["Cellcykelns faser G1, S, G2 och M, och vad som händer i varje.", "Mitosens fyra faser och cytokinesen.", "Hur meios skiljer sig från mitos, och när överkorsningen sker."], "bilder": ["s. 154: kromosomantalet vid mitos och meios (2n, 4n, n)", "s. 155: cellcykeln", "s. 157: mitosens faser", "s. 158: meios I och II", "s. 159: överkorsning"], "punkter": [["Mitos ger två identiska dotterceller med 46 kromosomer (2n).", ["mitos", "identisk|lika"]], ["Före delningen kopieras DNA i S-fasen (replikation): 2n blir 4n, 46 blir 92.", ["replikation|s-fas|kopier"]], ["Cellcykeln: G1 tillväxt, S replikation, G2 kontroll och reparation, M delning. G0 är normalfasen när cellen inte delar sig.", ["g1", "g2|kontroll"]], ["Mitosens faser: profas, metafas, anafas och telofas. Sedan delas cellen i cytokinesen.", ["profas", "metafas", "anafas", "telofas"]], ["Kärnspolar drar isär systerkromatiderna, som sitter ihop vid centromeren.", ["kärnspol", "centromer|systerkromatid|kromatid"]], ["Meios sker i äggstockar och testiklar och ger fyra könsceller med 23 kromosomer (n).", ["meios", "23|haploid|fyra"]], ["Överkorsning i profas I och slumpvis fördelning av kromosomerna ger nya genkombinationer.", ["överkorsning"]], ["En klon har samma genom som föräldern och bildas genom asexuell förökning, till exempel jordgubbens utlöpare.", ["klon"]]], "fragor": [["Vad är syftet med mitos?", ["Att bilda två identiska celler. Det behövs när vi växer, när sår läker och när gamla celler ska ersättas. Encelliga eukaryoter, till exempel amöbor, förökar sig genom mitos."]], ["Varför måste antalet kromosomer fördubblas före en celldelning?", ["Annars skulle varje dottercell bara få hälften av kromosomerna. Genom att allt DNA kopieras först (46 → 92, 2n → 4n) kan båda dottercellerna få en hel uppsättning (2n)."]], ["Beskriv cellcykelns faser.", ["G1 (tillväxtfas): proteinsyntes, organellerna fördubblas.", "S (syntesfas): DNA replikeras, 46 → 92.", "G2 (kontrollfas): DNA:t kontrolleras och fel repareras.", "M (mitos): cellen delar sig.", "G0 är normalfasen när cellen inte förbereder någon delning. G1, S och G2 kallas tillsammans interfas."]], ["Beskriv mitosens faser.", ["Profas: kromosomerna packas ihop, kärnmembranet löses upp och kärnspolar bildas.", "Metafas: kromosomerna ställer sig på en linje i mitten av cellen.", "Anafas: systerkromatiderna dras isär mot var sin ände.", "Telofas: nya kärnmembran bildas runt två nya kärnor.", "Cytokines: cellen snörs av till två dotterceller."]], ["Vad får systerkromatiderna att separera och flytta till var sin del av cellen under anafasen?", ["Kärnspolar, proteintrådar som utgår från centriolerna, fäster vid centromeren och drar isär systerkromatiderna."]], ["I vilka organ sker meios?", ["I äggstockarna och testiklarna. Hos kvinnor anläggs äggen redan under fosterlivet, hos män startar meiosen i puberteten."]], ["Hur kan helt nya genkombinationer uppkomma under meiosen?", ["Överkorsning: i profas I ligger kromosomerna i varje par tätt intill varandra och byter bitar.", "Slumpvis fördelning: det är slumpen vilken kromosom i varje par som hamnar i vilken könscell."]], ["Vad betyder haploid och diploid?", ["Haploid (n): en enkel uppsättning kromosomer, som i könscellerna (23 hos människan).", "Diploid (2n): en dubbel uppsättning, som i kroppscellerna (46)."]], ["En bananfluga har 8 kromosomer (4 par). Hur många kromosomer får cellerna när ett sår på flugans fot läker, och när flugans könsceller bildas?", ["När såret läker sker mitos: varje ny cell får 8 kromosomer.", "När könsceller bildas sker meios: varje könscell får 4 kromosomer."]], ["Vad är en klon? Ge exempel på kloner i naturen.", ["Individer med exakt samma genom. Kloner bildas vid asexuell förökning genom mitos, till exempel när jordgubbar, hirs eller kvickrot skickar ut utlöpare och bildar nya plantor."]], ["Vad är för- och nackdelen med asexuell förökning?", ["Fördel: den kostar mindre resurser och går snabbare.", "Nackdel: alla individer har samma gener, så hela populationen riskerar att slås ut om miljön förändras, till exempel vid ett svampangrepp."]]], "ovn": ["o_cykel", "o_mitos", "s_mitmei", "f_cykel", "rita_mitos", "fk_mitmei"]}, {"id": "p3", "n": 3, "c": "del", "t": "Mutationer, telomerer och kromosomernas byggnad", "pages": "160–165", "week": "v.44", "gissa": ["Röda blodkroppar lever ungefär fyra månader, men vissa nervceller lever hela livet. Varför tror du att celler inte kan dela sig hur många gånger som helst?", "I varje kromosoms ändar finns telomerer som skyddar kromosomen. De blir lite kortare vid varje delning, och när de blivit för korta slutar cellen dela sig. Skadade eller förbrukade celler kan också tas bort genom programmerad celldöd (apoptos)."], "guide": ["Vad som kan orsaka mutationer, och när de kan vara till nytta.", "Vad telomerer är och varför de har med åldrande att göra.", "Hur DNA packas till en kromosom, och vad homologa kromosomer är."], "bilder": ["s. 160: telomerer", "s. 161: tabellen över cellers livslängd", "s. 162: kol-14-metoden", "s. 165: kromosomens uppbyggnad och människans 23 kromosompar"], "punkter": [["Mutationer kan uppstå spontant eller orsakas av strålning, kemiska ämnen eller virus.", ["strålning|kemisk|virus"]], ["De flesta mutationer har ingen effekt eller är skadliga. Några få är fördelaktiga, till exempel motståndskraft mot hiv eller skydd mot malaria.", ["malaria|hiv|fördelaktig"]], ["Telomerer skyddar kromosomens ändar och blir kortare vid varje celldelning.", ["telomer"]], ["Apoptos är programmerad celldöd, ett kontrollerat sätt att bli av med skadade celler.", ["apoptos"]], ["DNA (negativt laddat) lindas runt histoner (positivt laddade). Tillsammans kallas det kromatin.", ["histon", "kromatin"]], ["Människan har 22 par autosomer och ett par könskromosomer.", ["autosom", "könskromosom|xx|xy"]], ["Homologa kromosomer har motsvarande gener på samma platser. Den ena kommer från mamman och den andra från pappan.", ["homolog"]], ["Med kol-14 från 1950- och 60-talens kärnvapenprov kan man mäta hur gamla celler är.", ["kol-14|kol 14|14c"]]], "fragor": [["Vad är en mutation, och hur kan den uppstå?", ["En förändring av den biologiska informationen i DNA. Mutationer kan ske spontant, till exempel som fel vid kopieringen, eller framkallas av strålning, kemiska ämnen eller virus."]], ["Ge exempel på en mutation som kan vara fördelaktig.", ["En mutation som ger motståndskraft mot hiv.", "Anlag för sicklecellanemi, som ger skydd mot malaria.", "Vissa vita blodkroppar genomgår mutationer som gör dem bättre på att bekämpa sjukdomar."]], ["Vilken betydelse har telomererna?", ["Telomererna sitter längst ut på kromosomerna och skyddar dem från skador. De kortas vid varje celldelning, vilket delvis förklarar att celler har begränsad livslängd och att vi åldras. Enzymet telomeras kan förlänga dem, och en hälsosam livsstil verkar hjälpa."]], ["Vad är apoptos och varför behövs det?", ["Programmerad celldöd. Förbrukade eller skadade celler bryts ner på ett kontrollerat sätt och tas om hand av andra celler. Det hindrar också vävnader från att växa okontrollerat."]], ["Hur har forskare med hjälp av kärnvapenprov kunnat ta reda på hur ofta celler delar sig?", ["Provsprängningarna fram till 1963 ökade halten av kol-14 i luften kraftigt. DNA som bildades då innehåller mer kol-14. Genom att mäta halten i cellernas DNA kan man se när cellen bildades. Så har man visat att nervcellerna i hjärnbarken inte delar sig efter födseln."]], ["Hur hänger begreppen DNA, histon och kromatin ihop?", ["DNA är negativt laddat och lindas runt de positivt laddade proteinerna histoner. Kombinationen av DNA och histoner kallas kromatin. Före en delning packas kromatinet tätt till synliga kromosomer."]], ["Vad är en autosom?", ["En kromosom som inte är en könskromosom. Människan har 22 par autosomer."]], ["Vad innebär det att kromosomer är homologa?", ["Att de har motsvarande gener på samma platser. I varje homologt par kommer den ena kromosomen från mamman och den andra från pappan."]], ["Hur hänger begreppen DNA-sträng, dubbelspiral och systerkromatid ihop?", ["Två DNA-strängar bildar tillsammans en dubbelspiral. Efter replikationen finns två identiska dubbelspiraler, systerkromatider, som sitter ihop vid centromeren."]], ["Varför är X och Y inte ett homologt par?", ["De är olika stora och bär olika gener. Y-kromosomen har bara omkring 45 gener."]]], "ovn": ["f_krom", "s_arvs", "fk_telomer"]}, {"id": "p4", "n": 4, "c": "arv", "t": "Kromosomavvikelser, kön och generna", "pages": "166–171", "week": "v.44", "gissa": ["Förr testade man idrottare vid OS för att se om de hade XX- eller XY-kromosomer. Varför tror du att man har slutat med det?", "Det är inte kromosomerna i sig som avgör, utan en enda gen på Y-kromosomen: SRY-genen. En person kan ha XY men vara kvinna, eller XX men vara man, om SRY-genen till exempel har hamnat på X-kromosomen vid en överkorsning."], "guide": ["Vilka kromosomavvikelser som finns hos människan och vad de beror på.", "Hur könet bestäms hos olika sorters djur, och vad SRY-genen gör.", "Generna: hur många vi har, vad de gör och vad som skiljer genotyp från fenotyp."], "bilder": ["s. 167: Klinefelters och Turners syndrom", "s. 169: SRY-genen och faktarutan om genernas uppgifter", "s. 171: hur aminosyror kopplas ihop till proteiner"], "punkter": [["Kromosomavvikelser uppstår vid celldelningen: kromosomer blir för många eller för få, eller delar saknas.", ["avvikelse|för många|för få"]], ["Downs syndrom är trisomi 21, alltså 47 kromosomer.", ["trisomi|downs"]], ["Klinefelters syndrom är XXY och Turners syndrom är X0.", ["klinefelter|turner"]], ["Polyploidi, alltså fler än två kromosomuppsättningar, är vanligt hos växter som banan, vete och jordgubbar.", ["polyploid"]], ["Hos däggdjur är hanen XY. Hos fåglar är honan ZW. Hos alligatorer avgör temperaturen.", ["zw|temperatur"]], ["SRY-genen på Y-kromosomen styr fostrets utveckling i manlig riktning.", ["sry"]], ["Kön kan beskrivas som biologiskt, socialt och juridiskt.", ["socialt|juridiskt"]], ["Människan har cirka 20 000 proteinkodande gener. Alla celler har alla gener men använder olika.", ["20 000|20000"]]], "fragor": [["Hur uppstår kromosomavvikelser?", ["Oftast vid en celldelning. Dottercellerna kan då få fler eller färre kromosomer än modercellen, eller så kan delar av en kromosom försvinna."]], ["Ge exempel på kromosomavvikelser i autosomerna och i könskromosomerna.", ["Autosomer: trisomi 21 (Downs syndrom, 47 kromosomer) och Prader-Willis syndrom (en del av kromosom 15 saknas eller fungerar inte).", "Könskromosomer: Klinefelters syndrom (XXY) och Turners syndrom (X0, 45 kromosomer)."]], ["Varför kan personer med trisomi 21 leva ett långt liv, medan trisomi 13 och 18 oftast är dödliga?", ["Kromosom 21 är mycket liten och har få gener. Kromosom 13 och 18 är större och bär betydligt fler gener, så en extra kopia ställer till mer."]], ["Hur definieras biologiskt kön?", ["Utifrån vilken sorts könsceller individen bildar. Den som bildar stora könsceller (ägg) är hona, den som bildar små (spermier) är hane."]], ["Beskriv hur könet bestäms hos olika organismgrupper.", ["Människa och andra däggdjur: hanen XY, honan XX.", "Fåglar och reptiler: hanen ZZ, honan ZW.", "Bin, getingar och myror: hanar har en enkel kromosomuppsättning (n), honor en dubbel (2n).", "Mississippialligatorn: temperaturen avgör, under 27 °C blir det honor och över 32 °C hanar."]], ["Varför kan det vara svårt att bestämma det biologiska könet bara genom att titta på om det finns en Y-kromosom?", ["Det är SRY-genen, inte hela Y-kromosomen, som styr utvecklingen. SRY kan saknas eller vara skadad på en Y-kromosom, eller ha hamnat på en X-kromosom genom överkorsning."]], ["Vilka tre huvudsakliga uppgifter har generna?", ["1. Se till att alla funktioner i kroppen utförs på rätt plats.", "2. Hjälpa individen att anpassa sig till miljön, till exempel fler röda blodkroppar på hög höjd.", "3. Föra vidare egenskaper till nästa generation."]], ["Hur kan proteiner ha så olika form och funktion, trots att de består av samma byggstenar?", ["Det finns 20 olika aminosyror. Proteinerna skiljer sig i hur många aminosyror de har och i vilken ordning de sitter, och det ger dem olika form och funktion."]], ["Granen har sju gånger större genom än människan. Betyder det att granen är mer avancerad?", ["Nej. Granens genom är så stort för att det innehåller mängder av pseudogener, kopior av gener som inte kodar för något protein. Granen kan inte göra sig av med onödigt DNA."]], ["Vad är skillnaden mellan genotyp och fenotyp?", ["Genotypen är vilka alleler en individ har. Fenotypen är de egenskaper som syns eller kan mätas, och den formas av genotypen tillsammans med miljön."]]], "ovn": ["s_kon", "s_kromtal", "s_gtft"]}, {"id": "p5", "n": 5, "c": "arv", "t": "Så ärvs egenskaper", "pages": "172–177", "week": "v.45", "gissa": ["Två föräldrar som inte har albinism får ett barn med albinism. Hur kan det hända?", "Båda föräldrarna är anlagsbärare: de har en normal allel (A) och en recessiv allel för albinism (a). Om barnet får a från båda blir det aa och får albinism. Risken är 1 på 4 (25 %) för varje barn."], "guide": ["Skillnaden mellan dominant och recessiv nedärvning, intermediär nedärvning och kodominans.", "Pleiotropi, polygen nedärvning och epistasi. Hitta ett exempel på varje.", "Hur ABO-blodgrupperna ärvs."], "bilder": ["s. 173: korsning mellan två anlagsbärare för albinism", "s. 174: den rosa underblomman och blodgrupperna", "s. 176: hudfärg och hönsens kammar"], "punkter": [["En allel är en variant av en gen. Homozygot betyder två likadana alleler, heterozygot två olika.", ["allel", "homozygot|heterozygot"]], ["En dominant allel (stor bokstav) syns även i en kopia. En recessiv allel (liten bokstav) syns bara om man har två.", ["dominant", "recessiv"]], ["En anlagsbärare har en recessiv allel utan att själv visa egenskapen.", ["anlagsbärare|bärare"]], ["Intermediär nedärvning ger en mellanform: röd × vit underblomma ger rosa (RV).", ["intermediär|rosa"]], ["Vid kodominans syns båda allelerna, som blodgrupp AB.", ["kodominans|ab"]], ["Pleiotropi: en gen påverkar flera egenskaper, till exempel vid PKU.", ["pleiotropi|pku|fenylketonuri"]], ["Polygen nedärvning: många gener och miljön ger en steglös egenskap, som hudfärg och längd.", ["polygen"]], ["Epistasi: en gen påverkar hur en annan gen uttrycks, som hönsens kammar och labradorens päls.", ["epistasi"]]], "fragor": [["Hur hänger begreppen gen och allel ihop?", ["En allel är en variant av en gen. I varje genpar finns två alleler, en från varje förälder, och de kan vara lika eller olika."]], ["Vad betyder det att en allel är dominant eller recessiv?", ["En dominant allel bestämmer egenskapen även om man bara har en. En recessiv allel syns bara om man har två.", "Dominans beror oftast på att allelen ger ett fungerande protein, medan den recessiva allelen inte gör det, till exempel på grund av en mutation."]], ["Vad är skillnaden mellan intermediär nedärvning och kodominans?", ["Intermediär: båda allelerna bidrar, och resultatet blir en mellanform. Röd och vit underblomma ger rosa, eftersom den heterozygota plantan bara gör hälften så mycket rött pigment.", "Kodominans: båda allelerna syns samtidigt, utan blandning. Blodgrupp AB har både A- och B-proteinet på de röda blodkropparna."]], ["Förklara pleiotropi med ett exempel.", ["En gen styr flera egenskaper. Vid fenylketonuri (PKU) fungerar inte genen för ett enzym som omvandlar fenylalanin till tyrosin. Det ger både utvecklingsstörning, kramper och ljusare hår och hud. Ett annat exempel är genen p53."]], ["Förklara epistasi.", ["En gen påverkar hur en annan gen uttrycks. Hos labrador bestämmer B-genen pälsfärgen (svart eller brun), men om hunden är ee för E-genen bildas inget pigment och pälsen blir ljus, oavsett B-genen."]], ["Vad är skillnaden mellan monogena och polygena egenskaper?", ["Monogena egenskaper styrs av en enda gen, till exempel blödarsjuka och cystisk fibros.", "Polygena egenskaper styrs av många gener tillsammans och påverkas ofta av miljön, till exempel längd och hudfärg."]], ["Varför är de flesta vanliga egenskaper polygena, medan monogena egenskaper ofta är sjukdomar?", ["Vanliga egenskaper som längd varierar steglöst, och det kräver många gener som bidrar lite var. När en enda viktig gen slutar fungera blir effekten däremot stor och tydlig, och då blir det ofta en sjukdom."]], ["Hur kan två individer ha olika fenotyp trots att de har identisk genotyp?", ["Miljön påverkar vilka gener som används och hur mycket. Enäggstvillingar har samma genotyp men kan få olika utseende, fingeravtryck och sjukdomar på grund av olika miljö och epigenetiska förändringar."]], ["Mamman har blodgrupp A (genotyp A0) och pappan blodgrupp B (B0). Vilka blodgrupper kan barnen få?", ["Könscellerna blir A eller 0 från mamman och B eller 0 från pappan. Barnen kan få AB, A0 (blodgrupp A), B0 (blodgrupp B) eller 00 (blodgrupp 0), med 25 % chans för varje."]]], "ovn": ["korsning", "s_nedarv", "s_gtft", "fk_domrec"]}, {"id": "p6", "n": 6, "c": "arv", "t": "Släkttavlor, X-bundna sjukdomar och Mendels lagar", "pages": "178–182", "week": "v.45", "gissa": ["I nästan alla länder är det förbjudet för syskon att få barn tillsammans. Vilket biologiskt skäl tror du att det finns?", "Nära släktingar bär oftare på samma recessiva sjukdomsallel. Då blir risken mycket större att ett barn får två kopior av allelen och blir sjukt, till exempel av PKU."], "guide": ["Skillnaden mellan autosomalt recessiv, autosomalt dominant och X-bunden nedärvning, med ett exempel på varje.", "Hur man läser en släkttavla.", "Mendels försök: P, F1 och F2, och klyvningstalen 3:1 och 9:3:3:1."], "bilder": ["s. 179: släkttavlan och X-bunden nedärvning", "s. 180: monohybrid nedärvning", "s. 182: dihybrid nedärvning"], "punkter": [["En släkttavla (pedigree) visar hur en egenskap ärvs: cirkel är kvinna, fyrkant man, ifylld symbol betyder drabbad.", ["släkttavla|pedigree"]], ["Cystisk fibros ärvs autosomalt recessivt. Huntingtons sjukdom ärvs autosomalt dominant.", ["cystisk fibros|huntington"]], ["X-bundna recessiva sjukdomar som blödarsjuka och färgblindhet drabbar män oftare, eftersom de bara har ett X.", ["x-bund|blödarsjuka|färgblind"]], ["En X-bunden sjukdom kan inte gå från far till son.", ["far till son|pappa till son|son"]], ["Mendel korsade ärtor: P-generationen ger F1, och F1 ger F2.", ["f1|f2"]], ["Monohybrid nedärvning ger klyvningstalet 3:1 i fenotyp och 1:2:1 i genotyp.", ["3:1"]], ["Dihybrid nedärvning, där man följer två gener, ger 9:3:3:1.", ["9:3:3:1|dihybrid"]], ["Med knock-out-försök slår man ut en gen för att se vad den gör, till exempel myostatin.", ["knock|myostatin"]]], "fragor": [["Vilka genetiska argument finns för att förbjuda barn mellan nära släktingar?", ["Släktingar delar fler gener och bär oftare på samma recessiva sjukdomsallel. Två syskon som får barn har till exempel mycket större risk än obesläktade att båda är bärare, och då kan barnet få två kopior och bli sjukt."]], ["Vad är skillnaden mellan autosomalt recessiv och autosomalt dominant nedärvning? Ge exempel.", ["Recessiv: man måste ha två sjukdomsalleler för att bli sjuk, och friska anlagsbärare kan få sjuka barn. Exempel: cystisk fibros och PKU.", "Dominant: en enda allel räcker, så minst en förälder är oftast sjuk. Exempel: Huntingtons sjukdom."]], ["Varför drabbas män oftare än kvinnor av X-bundna sjukdomar?", ["Män har bara en X-kromosom. Har den den recessiva allelen finns det inget annat X som kan kompensera. Kvinnor har två X och blir oftast bara anlagsbärare."]], ["Kan en pappa föra över en X-bunden sjukdom till sin son?", ["Nej. Pappan ger sin son en Y-kromosom, inte sitt X. Däremot får alla hans döttrar hans X och blir anlagsbärare."]], ["Beskriv Mendels försök med gula och gröna ärtor.", ["Han korsade plantor med gula ärtor (GG) med plantor med gröna (gg). Alla i F1 fick gula ärtor (Gg).", "När F1 fick självbefrukta sig fick ungefär en fjärdedel av F2 gröna ärtor igen, förhållandet 3:1."]], ["Vad är ett klyvningstal? Ge exempel.", ["Förhållandet mellan antalet individer med olika fenotyper. Mendel fick 6 022 gula och 2 001 gröna ärtor, 6 022 / 2 001 ≈ 3,01, alltså 3:1. Vid dihybrid nedärvning blir klyvningstalet 9:3:3:1."]], ["Vilka fyra punkter sammanfattar Mendels teori?", ["1. Varje egenskap motsvaras av två arvsanlag.", "2. Det ena anlaget kommer från modern och det andra från fadern.", "3. Anlagen ärvs oberoende av varandra.", "4. Anlagen förs vidare oförändrade från generation till generation."]], ["Hur kan man ta reda på vilken funktion en gen har?", ["Genom att studera vad som går fel hos personer där genen inte fungerar.", "Genom knock-out-försök, där man tar bort genen hos till exempel en mus. Möss utan myostatin-genen fick dubbelt så stora muskler.", "Genom bioinformatik, där man jämför gener med varandra."]], ["Mendel såg aldrig några gener. Hur kunde han ändå formulera en teori om arvet?", ["Han byggde en vetenskaplig modell utifrån sina observationer. Egenskaper som försvann i en generation kom tillbaka i nästa, och F2 fick alltid 3:1. Det krävde att det fanns oföränderliga anlag i par som fördelas slumpmässigt."]]], "ovn": ["korsning", "slakt", "s_sjuk", "fk_xbund"]}, {"id": "p7", "n": 7, "c": "dna", "t": "DNA och RNA, replikation och den genetiska koden", "pages": "183–187", "week": "v.45", "gissa": ["DNA-språket har bara fyra bokstäver: A, T, G och C. Hur kan det räcka för att bygga allt från en bakterie till en människa?", "Det är ordningen på bokstäverna som bär informationen. Tre bokstäver i rad bildar ett ”ord” som betyder en aminosyra, och med fyra bokstäver finns 64 sådana ord. En gen på några hundra baser kan kombineras på ett nästan oändligt antal sätt."], "guide": ["Hur DNA och RNA är uppbyggda, och vad som skiljer dem.", "Replikationens steg: helikas, DNA-polymeras, ledande och släpande sträng, Okazaki-fragment och ligas.", "Hur den genetiska koden fungerar: triplett, kodon, startkodon och stoppkodon."], "bilder": ["s. 183: RNA och DNA", "s. 184: nukleotiderna och vätebindningarna", "s. 185: replikationsgaffeln", "s. 187: kodonsolen"], "punkter": [["En nukleotid består av en fosfatgrupp, ett socker och en kvävebas.", ["nukleotid", "fosfat|socker"]], ["DNA har sockret deoxiribos och baserna A, T, G och C, och är dubbelsträngat. RNA har ribos och U i stället för T, och är enkelsträngat.", ["ribos|uracil|enkel"]], ["Det finns flera sorters RNA: mRNA, tRNA, rRNA och mikroRNA.", ["mrna|trna|rrna"]], ["Strängarna är komplementära (A–T, G–C), hålls ihop av vätebindningar och är antiparallella (5'–3').", ["komplementär|vätebind|antiparallell"]], ["Vid replikationen öppnar helikas dubbelspiralen och DNA-polymeras bygger nya strängar.", ["helikas", "polymeras"]], ["Den ledande strängen kopieras i ett svep, den släpande i bitar (Okazaki-fragment) som ligas limmar ihop.", ["okazaki|släpande|ligas"]], ["Tre baser i DNA kallas triplett, tre baser i mRNA kallas kodon. Varje kodon motsvarar en aminosyra eller start/stopp.", ["triplett|kodon"]], ["Det finns 64 kodon men bara 20 aminosyror. AUG är startkodon och det finns tre stoppkodon.", ["64|20|aug|stopp"]]], "fragor": [["Vad skiljer RNA från DNA?", ["RNA är enkelsträngat, DNA dubbelsträngat.", "RNA har sockret ribos, DNA har deoxiribos.", "RNA har basen uracil (U) i stället för tymin (T)."]], ["Vilka sorters RNA finns det och vad gör de?", ["mRNA: en kopia av en gen som används som mall för proteinet.", "tRNA: hämtar aminosyror till ribosomen.", "rRNA: bygger upp ribosomerna tillsammans med proteiner.", "mikroRNA: reglerar translationen genom att blockera vissa mRNA."]], ["Vad betyder det att DNA-strängarna är komplementära och antiparallella?", ["Komplementära: baserna passar bara ihop på ett sätt, A med T och G med C. Därför finns informationen i den ena strängen även i den andra.", "Antiparallella: strängarna löper åt motsatta håll, den ena från 5' till 3' och den andra från 3' till 5'."]], ["Beskriv hur DNA-molekylen kopierar sig själv vid replikationen.", ["Enzymet helikas skiljer strängarna åt vid replikationsgaffeln. Båda strängarna fungerar som mallar. DNA-polymeras bygger nya, komplementära strängar. Resultatet blir två identiska DNA-molekyler, systerkromatiderna."]], ["Varför kopieras den ena strängen i små bitar?", ["DNA-polymeras kan bara bygga i riktningen 5' till 3'. Den släpande strängen löper åt fel håll, så den kopieras bit för bit i Okazaki-fragment som enzymet ligas sedan limmar ihop."]], ["Vad är skillnaden mellan en triplett och ett kodon?", ["En triplett är tre kvävebaser i rad i DNA. Ett kodon är motsvarande tre baser i mRNA. Varje kodon står för en aminosyra eller en start- eller stoppsignal."]], ["Varför finns det 64 kodon men bara 20 aminosyror?", ["Fyra baser i grupper om tre ger 4 × 4 × 4 = 64 kombinationer. Eftersom det bara finns 20 aminosyror har de flesta aminosyror flera kodon. Tre kodon är stoppkodon."]], ["En gen är 252 kvävebaser lång. För ungefär hur många aminosyror kodar den?", ["252 / 3 = 84 tripletter, alltså ungefär 84 aminosyror (förenklat)."]], ["Varför går det att analysera DNA från neandertalare och mammutar?", ["DNA är en kemiskt mycket stabil molekyl och kan bevaras länge, till exempel i skelett, mumier eller infrysta djur."]]], "ovn": ["f_dna", "f_bas", "f_repl", "o_repl", "s_dnarna", "mutlab"]}, {"id": "p8", "n": 8, "c": "dna", "t": "Från gen till protein och genmutationer", "pages": "188–192", "week": "v.45", "gissa": ["DNA stannar i cellkärnan, men proteinerna byggs i ribosomerna ute i cytoplasman. Hur kan DNA:t ändå styra vilka proteiner som byggs?", "Genen kopieras till en budbärare, mRNA, som kan lämna kärnan. Ute vid ribosomen läses mRNA:t av och aminosyrorna kopplas ihop i rätt ordning."], "guide": ["Transkription och splitsning: pre-mRNA, exoner och introner.", "Translation: ribosomen, tRNA, antikodon och platserna E, P och A.", "Vad som kan hända när en bas byts ut, läggs till eller försvinner."], "bilder": ["s. 188: transkriptionen", "s. 189: splitsningen", "s. 190–191: proteinsyntesen steg för steg", "s. 192: parallellförskjutning"], "punkter": [["Vid transkriptionen kopierar RNA-polymeras genen till pre-mRNA i cellkärnan, med hjälp av transkriptionsfaktorer.", ["transkription", "rna-polymeras|pre-mrna"]], ["Bara cirka 1,5 % av genomet kodar för proteiner. Resten kallades förr skräp-DNA.", ["1,5|skräp"]], ["Vid splitsningen klipps intronerna bort och exonerna fogas ihop till mRNA. En gen kan ge flera proteiner.", ["splits", "exon|intron"]], ["Vid translationen i ribosomen binder tRNA med rätt antikodon till mRNA:ts kodon.", ["translation", "antikodon|trna"]], ["Aminosyrorna kopplas ihop tills ett stoppkodon kommer. Kedjan veckas till ett tredimensionellt protein.", ["stoppkodon|veck"]], ["En utbytt bas kan ge samma aminosyra (tyst), en liknande eller en helt annan aminosyra.", ["tyst"]], ["Om en eller två baser försvinner eller läggs till förskjuts läsningen (parallellförskjutning), vilket oftast är värst.", ["förskjut"]], ["Vid sicklecellanemi byts GAG mot GTG, och glutaminsyra blir valin.", ["sicklecell|valin"]]], "fragor": [["Var sker transkriptionen, och vad bildas?", ["I cellkärnan. Enzymet RNA-polymeras kopierar genen till en pre-mRNA-molekyl, en arbetskopia av genen."]], ["Vad är en transkriptionsfaktor?", ["Ett protein som binder till en gens promotor och underlättar eller hindrar att RNA-polymeras börjar transkribera genen. På så sätt styrs hur mycket mRNA som bildas."]], ["Vad är splitsning?", ["När pre-mRNA klipps itu. De delar som inte används, intronerna, klipps bort, och de delar som kodar för proteinet, exonerna, fogas ihop till färdigt mRNA. Exonerna kan fogas ihop på olika sätt, så en gen kan ge flera olika proteiner."]], ["Vilken funktion har mRNA, tRNA och rRNA i proteinsyntesen?", ["mRNA för informationen från genen ut till ribosomen.", "tRNA hämtar rätt aminosyra till varje kodon.", "rRNA bygger tillsammans med proteiner upp ribosomen, där aminosyrorna kopplas ihop."]], ["Beskriv translationen.", ["mRNA binds till en ribosom. Ett tRNA med rätt antikodon och en aminosyra binder till kodonet på plats A. Aminosyran kopplas till kedjan, och ribosomen flyttar fram ett kodon i taget (A → P → E). När ett stoppkodon kommer frigörs proteinet, som veckas till sin färdiga form."]], ["Vad kan hända om en kvävebas i DNA byts ut mot en annan?", ["1. Kodonet ger samma aminosyra: en tyst mutation, proteinet fungerar.", "2. Det blir en annan aminosyra med liknande egenskaper: proteinet fungerar oftast tillräckligt bra.", "3. Det blir en aminosyra med andra egenskaper, eller ett stoppkodon: proteinet kan få annan form eller sluta fungera. Exempel: sicklecellanemi."]], ["Varför är det oftast värre om en eller två baser försvinner än om tre gör det?", ["Försvinner tre baser saknas bara en aminosyra. Försvinner en eller två förskjuts läsramen (parallellförskjutning): alla kodon efter blir fel, och resultatet blir nonsens eller ett tidigt stopp."]], ["Meningen är HAN SER SJU GRÅ FÅR. Vad händer om R:et i SER försvinner, och vad motsvarar det i DNA?", ["Läser man fortfarande tre bokstäver i taget blir det HAN SES JUG RÅF ÅR, alltså obegripligt. Det motsvarar en parallellförskjutning i DNA, där alla kodon efter mutationen läses fel."]], ["Vad är sicklecellanemi, och hur hänger det ihop med en mutation?", ["En blodsjukdom där tripletten GAG ändrats till GTG i genen för hemoglobin. Glutaminsyra byts då mot valin, och de röda blodkropparna blir deformerade och sämre på att transportera syre."]]], "ovn": ["o_prot", "f_prot", "f_ribo", "mutlab", "s_mutkons", "rita_prot", "fk_prot"]}, {"id": "p9", "n": 9, "c": "epi", "t": "Epigenetik och genreglering", "pages": "193–199", "week": "v.45", "gissa": ["Enäggstvillingar har nästan exakt samma gener. Varför har de ändå olika fingeravtryck och kan få olika sjukdomar?", "Miljön påverkar vilka gener som slås på och av och hur mycket de används. Redan i livmodern får tvillingarna lite olika miljö, och sedan lever de olika liv. Det kallas epigenetik."], "guide": ["Den centrala dogmen, och varför samma genotyp ändå kan ge olika fenotyp.", "Genregleringens fyra nivåer.", "Hur DNA-metylering och histonmodifiering fungerar, och vad som påverkar dem.", "Vad heritabilitet är, och vad tvillingstudier kan visa."], "bilder": ["s. 194: epigenetiska förändringar", "s. 195: faktorer som påverkar metyleringen", "s. 198: tvillingarna Otto och Ewald", "s. 199: träningssvar hos tvillingar"], "punkter": [["Den centrala dogmen: DNA → RNA → protein.", ["dogm"]], ["Genuttrycket styrs av yttre miljö (sol, höjd, rök) och inre miljö (kost, sömn, stress).", ["miljö", "kost|sömn|stress|sol"]], ["Genregleringen sker på fyra nivåer: epigenetisk, transkriptionell, post-transkriptionell och post-translationell.", ["transkriptionell|nivå"]], ["Epigenetik ändrar genuttrycket utan att ändra DNA:ts bassekvens.", ["epigenetik"]], ["DNA-metylering: metylgrupper vid genens promotor stänger av genen.", ["metyl"]], ["Histonmodifiering: tätt packat DNA (heterokromatin) är svårt att läsa, löst packat (eukromatin) lätt.", ["histon|heterokromatin|eukromatin"]], ["Epigenomet kopieras vid mitos men raderas till största delen när könsceller bildas.", ["epigenom|könscell"]], ["MikroRNA kan blockera mRNA (Nobelpriset 2024).", ["mikrorna|mirna"]], ["Heritabilitet (0–1) anger hur stor del av variationen i en egenskap som beror på arv, i en viss population och miljö.", ["heritabilitet"]]], "fragor": [["Vad innebär genuttryck?", ["Att informationen i en gen förs över till ett protein genom transkription och translation. Genen ”uttrycks”. Vilka gener som uttrycks, och hur mycket, avgör cellens egenskaper."]], ["Vad säger den centrala dogmen, och varför ger samma genotyp ändå inte alltid samma fenotyp?", ["Den centrala dogmen: information går från DNA till RNA till protein. Men vilka gener som används och hur mycket styrs av miljön, så individer med samma genotyp kan få olika fenotyp."]], ["Vilka är genregleringens fyra nivåer?", ["1. Epigenetisk reglering: hur tillgängligt DNA:t är för att läsas av.", "2. Transkriptionell reglering: om och hur mycket mRNA som bildas.", "3. Post-transkriptionell reglering: hur mRNA:t utformas (splitsning) och hur mycket som översätts (mikroRNA).", "4. Post-translationell reglering: proteinerna ändras eller bryts ner."]], ["Förklara hur epigenetiska förändringar påverkar transkriptionen av gener.", ["Vid DNA-metylering binds metylgrupper vid genens promotor, så att reglerande proteiner inte kommer åt och genen stängs av.", "Vid histonmodifiering ändras hur hårt DNA:t är packat runt histonerna. Tätt packat (heterokromatin) är svårt att transkribera, löst packat (eukromatin) lätt."]], ["Vad kan påverka det epigenetiska mönstret?", ["Kost, fysisk aktivitet, rökning, alkohol, läkemedel, sömn, miljögifter och stress. Mönstret förändras också när vi åldras, och påverkas redan under fosterlivet."]], ["Vad är mikroRNA?", ["Korta RNA-molekyler som kan binda till mRNA och blockera det, så att det inte blir något protein. MikroRNA finjusterar genuttrycket. Upptäckten gav Nobelpriset i fysiologi eller medicin 2024."]], ["Vad är heritabilitet? Ge ett exempel på hur den kan förändras.", ["Ett mått mellan 0 och 1 på hur stor del av variationen i en egenskap i en viss population som beror på arv. Heritabiliteten är ofta högre i en god och stabil miljö.", "Exempel: när fler fått tillräckligt med mat har heritabiliteten för längd ökat. Behandling av blödarsjuka har i stället minskat heritabiliteten för sjukdomssymtomen."]], ["Hur kan man ta reda på hur mycket av en egenskap som beror på gener och hur mycket på miljön?", ["Med tvillingstudier: man jämför enäggstvillingar (samma gener) med tvåäggstvillingar. Om enäggstvillingar är mycket mer lika varandra spelar generna stor roll.", "Med adoptionsstudier: man jämför adopterade med både sina biologiska föräldrar (som de delar gener med) och sina adoptivföräldrar (som de delar miljö med)."]], ["Varför blir vissa människor mycket bättre av träning än andra?", ["Ungefär hälften av skillnaden i träningssvar beror på gener. Den som har fördelaktiga genvarianter kan förbättra sig flera gånger mer. Men den som svarar dåligt på en sorts träning kan svara bra på en annan."]]], "ovn": ["f_epi", "o_regl", "s_epimut", "s_regl", "fk_epi", "hemma"]}, {"id": "p10", "n": 10, "c": "gte", "t": "Bioteknik: PCR, gentester och GMO", "pages": "208–213", "week": "v.46", "gissa": ["Vid ett inbrott hittar polisen ett enda hårstrå. Hur kan så lite DNA räcka för att se vem det kommer från?", "Med PCR-metoden kopieras DNA:t miljontals gånger, tills det finns tillräckligt att analysera. Sedan jämför man vissa delar av DNA:t som skiljer sig mycket mellan människor."], "guide": ["Skillnaden mellan genetik, genteknik och bioteknik.", "PCR-metodens tre steg och temperaturer.", "Vad DNA-teknik används till: fosterdiagnostik, gentester, brottsutredningar och arkeologi.", "Hur man flyttar en gen till en bakterie (hybrid-DNA-teknik)."], "bilder": ["s. 208: faktarutan om genetik, genteknik och bioteknik", "s. 209: PCR-metoden", "s. 213: hybrid-DNA-teknik"], "punkter": [["Genetik är läran om arvet. Genteknik är metoder för att undersöka och ändra gener. Bioteknik är det bredare begreppet för att använda levande celler tekniskt.", ["genteknik|bioteknik"]], ["PCR kopierar DNA: 95 °C separerar strängarna, vid 50–70 °C binder primers, vid 68–72 °C kopierar DNA-polymeras.", ["pcr", "95|primer"]], ["Med DNA-sekvensering bestämmer man basernas exakta ordning.", ["sekvens"]], ["Gentester och fosterdiagnostik kan visa risk för ärftliga sjukdomar och kromosomavvikelser.", ["gentest|foster"]], ["En DNA-profil från ett brottsplatsspår visar identitet, inte egenskaper.", ["identitet|brott|dna-profil"]], ["Mitokondrie-DNA ärvs från mamman och Y-kromosomen från pappan, och det används för att följa folkvandringar.", ["mitokondri|folkvandring"]], ["Genbanker som Svalbard sparar frön för framtiden.", ["genbank|svalbard"]], ["Hybrid-DNA-teknik: en gen klipps ut och sätts in i en plasmid, som förs in i en bakterie. Det ger en GMO.", ["plasmid|hybrid|gmo"]]], "fragor": [["Vad är skillnaden mellan genetik, genteknik och bioteknik?", ["Genetik: vetenskapen om ärftlighet, genomet och variation.", "Genteknik: metoder för att undersöka och förändra gener och flytta DNA mellan organismer.", "Bioteknik: det bredaste begreppet, att använda levande celler eller delar av celler tekniskt. Det omfattar även genteknik och till exempel jäst i bröd."]], ["Hur fungerar PCR-metoden?", ["1. Provet värms till 95 °C så att DNA-strängarna separeras.", "2. Det svalnar till 50–70 °C så att primers binder.", "3. Vid 68–72 °C bygger DNA-polymeras nya komplementära strängar.", "Cykeln upprepas och DNA-mängden fördubblas varje varv."]], ["Vad kan man använda PCR till?", ["För att få fram tillräckligt med DNA för analys, till exempel i brottsutredningar, gentester, diagnos av infektioner och forskning. PCR gjorde HUGO-projektet möjligt."]], ["Vad är DNA-sekvensering?", ["En metod för att ta reda på kvävebasernas exakta ordning i DNA. I dag kan hela människans genom sekvenseras snabbt och billigt."]], ["Vad kan man använda gentester till?", ["För att bedöma risken för ärftliga sjukdomar som cystisk fibros och Huntingtons sjukdom, i fosterdiagnostik, för att hitta orsaken till infektioner och för att välja läkemedel som passar en persons genotyp."]], ["Hur kan man ta reda på hur olika folkgrupper har förflyttat sig under historien?", ["Genom att analysera mitokondrie-DNA, som bara ärvs från mamman, och gener på Y-kromosomen, som bara finns hos män och ärvs från pappan."]], ["Vad får polisen veta av en DNA-profil?", ["Bara om provet kommer från en viss person, alltså identitet. Man jämför delar av DNA:t som varierar mycket mellan människor, inte gener för egenskaper."]], ["Varför har man skapat genbanker?", ["För att bevara arter och sorter vars egenskaper kan behövas i framtiden. Vi odlar bara 100–200 av de över 7 000 växtarter människan använt. Svalbard Global Seed Vault kan lagra frön från 4,5 miljoner växtsorter."]], ["Hur går en genöverföring med hybrid-DNA-teknik till?", ["Man klipper ut en gen med restriktionsenzymer, sätter in den i en plasmid och för in plasmiden i en bakterie. Bakterien blir då genmodifierad (transgen) och kan till exempel tillverka mänskligt insulin.", "Upptaget av DNA kan underlättas med viruspartiklar som bärare eller med värme- och elchocker."]]], "ovn": ["o_pcr", "o_hybrid", "f_pcr", "f_hyb", "s_tek", "fk_pcr"]}, {"id": "p11", "n": 11, "c": "gte", "t": "Genterapi, CRISPR och etik", "pages": "214–219", "week": "v.46", "gissa": ["Gensaxen CRISPR kan laga en sjuk gen. Om samma teknik kunde göra människor starkare eller smartare, borde vi använda den då?", "Det finns inget facit, men boken visar hur man kan resonera. Konsekvensetiken väger nytta mot risker. Pliktetiken utgår från regler om vad som är rätt. Försiktighetsprincipen säger att man ska avstå om det kan orsaka skada."], "guide": ["Exempel på genmodifierade växter och djur.", "Vad genterapi är, och hur CRISPR-Cas9 fungerar och används.", "Gendoping, de etiska skolorna och försiktighetsprincipen.", "Vem som äger dina gener."], "bilder": ["s. 214: insulinproduktion och SCID", "s. 215: Charpentier och Doudna, sicklecellanemi", "s. 217: demonstrationer för och emot GMO"], "punkter": [["Bakterier tillverkar mänskligt insulin, tillväxthormon och EPO.", ["insulin"]], ["Exempel på GMO: soja, raps, majs, gyllene ris med A-vitamin, och kor med laktosfri mjölk.", ["gyllene ris|soja|majs|gmo"]], ["Genterapi: en sjuk person får en frisk gen, ofta med virus som bärare, till exempel vid SCID.", ["genterapi"]], ["CRISPR-Cas9 är en gensax från bakteriers immunförsvar (Nobelpris 2020 till Charpentier och Doudna).", ["crispr"]], ["Med CRISPR behandlas i dag talassemi och sicklecellanemi.", ["sicklecell|talassemi"]], ["Gendoping är förbjudet inom idrotten.", ["gendoping|doping"]], ["Konsekvensetik väger för- och nackdelar, pliktetik följer moraliska regler, och miljöetik vill inte ändra naturens arvsmassa.", ["konsekvens|plikt"]], ["Försiktighetsprincipen: en verksamhet kan stoppas om den kan skada, även utan säkra bevis.", ["försiktighet"]]], "fragor": [["Ge exempel på genmodifierade växter och djur.", ["Växter: soja, raps, majs och ris, till exempel det gyllene riset som ger mer A-vitamin och järn.", "Djur: kor som ger laktosfri mjölk och får som ger ett protein som behövs vid cystisk fibros.", "Bakterier som tillverkar insulin och tillväxthormon."]], ["Vad är genterapi?", ["En sjuk person får en frisk gen så att sjukdomen lindras eller botas. Ofta används viruspartiklar för att få in genen i cellerna. Exempel: immunbristsjukdomen SCID, en ögonsjukdom som ger blindhet, talassemi och en muskelsjukdom."]], ["Vad är CRISPR-Cas9?", ["En gensax som kommer från bakteriers uråldriga immunförsvar mot virus. Forskare har gjort om den så att den kan klippa och klistra DNA på exakt rätt ställe. Charpentier och Doudna fick Nobelpriset i kemi 2020."]], ["Hur kan CRISPR användas mot sicklecellanemi?", ["Man tar ut blodbildande stamceller från patienten och redigerar en gen så att cellerna gör mer av det hemoglobin som bildas under fosterstadiet. Patienten får då fungerande hemoglobin och slipper blodtransfusioner och smärta."]], ["Vad är gendoping, och varför är det ett problem?", ["Att överföra eller ändra DNA eller RNA för att förbättra prestationen. Det är förbjudet inom idrotten. Genterapi för att stärka muskler hos sjuka kan missbrukas av idrottare."]], ["Vad är skillnaden mellan konsekvensetik, pliktetik och miljöetik?", ["Konsekvensetik (utilitarism): väg för- och nackdelar, målet är så mycket nytta och lycka som möjligt.", "Pliktetik: följ moraliskt grundade regler, även om resultatet i ett enskilt fall blir sämre.", "Miljöetik: organismers naturliga arvsmassa bör inte förändras alls."]], ["Vad innebär försiktighetsprincipen?", ["Den som bedriver en verksamhet ska förebygga och hindra att den skadar människors hälsa eller miljön. En verksamhet kan stoppas även om det inte finns vetenskapliga bevis för att den är skadlig."]], ["Kan man ta patent på gener?", ["Man kan inte ta patent på upptäckter i naturen. Men en gensekvens kan ingå i en patenterad uppfinning, till exempel om den används för att tillverka ett läkemedel. År 2013 beslutade USA:s högsta domstol att naturliga gener inte får patenteras."]]], "ovn": ["etik", "s_etik", "fk_crispr"]}, {"id": "p12", "n": 12, "c": "rep", "t": "Blandad repetition: celldelning och arv", "pages": "–", "week": "v.46", "rep": ["p1", "p2", "p3", "p4", "p5", "p6"], "ovn": ["korsning", "slakt", "o_tid", "s_mitmei", "s_nedarv"]}, {"id": "p13", "n": 13, "c": "rep", "t": "Blandad repetition: DNA, proteiner, epigenetik och bioteknik", "pages": "–", "week": "v.46", "rep": ["p7", "p8", "p9", "p10", "p11"], "ovn": ["mutlab", "o_prot", "f_prot", "f_epi", "o_pcr", "etik"]}, {"id": "p14", "n": 14, "c": "rep", "t": "Provträning: allt blandat", "pages": "–", "week": "v.47", "rep": ["p1", "p2", "p3", "p4", "p5", "p6", "p7", "p8", "p9", "p10", "p11"], "ovn": ["prov", "begrepp"]}, {"id": "p15", "n": 15, "c": "rep", "t": "Dagen före provet", "pages": "–", "week": "v.47", "rep": ["p1", "p2", "p3", "p4", "p5", "p6", "p7", "p8", "p9", "p10", "p11"], "ovn": ["kort", "o_prot", "o_cykel", "korsning"]}], "ORDER": {"o_tid": ["Genetikens historia – tidslinje", "his", "Börja med det som hände först.", ["Mendel publicerar sina ärtförsök (1865–66)", "Darwin lanserar pangenesteorin (1868)", "Mendels resultat återupptäcks (1900)", "Morgan visar med bananflugor att generna sitter i kromosomerna (början av 1900-talet)", "Avery visar att DNA bär arvet (1944)", "Watson och Crick beskriver dubbelspiralen (1953)", "Den genetiska koden knäcks (1960-talet)", "PCR-metoden uppfinns (1980-talet)", "HUGO-projektet blir klart (2003)", "CRISPR-Cas9 upptäcks som gensax (2012–2013)", "Nobelpris för mikroRNA (2024)"]], "o_cykel": ["Cellcykeln", "del", "Börja med en nybildad cell som ska dela sig igen.", ["G1 – cellen växer och gör proteiner", "S – DNA replikeras", "G2 – DNA kontrolleras och repareras", " const $ = (s, r) => (r || document).querySelector(s);

  const e = document.createElement(tag);

    const v = attrs[k];

    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.setAttribute('style', v);

function pickWeighted(ids, n, unseenW) {
  const pool = ids.map(id => ({ id, w: weight(id, unseenW) * (0.6 + Math.random() * 0.8) }));
  pool.sort((a, b) => b.w - a.w);
  return pool.slice(0, n).map(x => x.id);
}

/* ===================== Drag-hjälp ===================== */
function dragChip(c, selector, onDrop, onTap) {
  let sx, sy, ghost = null, moved = false;
  c.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; moved = false; try { c.setPointerCapture(e.pointerId); } catch (_) {} });
  c.addEventListener('pointermove', e => {
    if (sx === undefined) return;
    if (!ghost && Math.hypot(e.clientX - sx, e.clientY - sy) > 6) { ghost = c.cloneNode(true); ghost.classList.add('ghost', 'sel'); document.body.appendChild(ghost); moved = true; }
    if (ghost) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; }

function bCards(body, list) {
