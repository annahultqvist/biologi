html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",Verdana,"Segoe UI",sans-serif;font-size:1.1rem;line-height:1.7;letter-spacing:.01em}
.wrap{max-width:48rem;margin:0 auto;padding:1.2rem 1rem 4rem}
h1{font-size:2rem;line-height:1.2;margin:.4rem 0 .4rem}
h2{font-size:1.4rem;line-height:1.3;margin:0 0 .5rem}
h3{font-size:1.12rem;margin:1rem 0 .3rem}
p{margin:.4rem 0 .8rem}
a{color:inherit}
.soft{color:var(--soft)}
.small{font-size:.95rem}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{font-size:1rem;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:.45rem .9rem;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem}
.btn.main{background:var(--c,#3566B8);border-color:var(--c,#3566B8);color:#fff;font-weight:500}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.count{color:var(--soft);font-size:.95rem;margin-left:auto}
.topnav{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 1rem}
.topnav a{font-size:.95rem;text-decoration:none;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.25rem .8rem}
.topnav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--paper);border-radius:14px;padding:1.1rem 1.2rem;margin:0 0 1.1rem;border:2px solid var(--line)}
.card.k{border-left:10px solid var(--c)}
.hero{border-left:10px solid var(--c);background:var(--paper);border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:1.2rem}
.hero .big{font-size:2.6rem;font-weight:700;line-height:1;color:var(--c)}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:.5rem 0}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.stat{display:flex;gap:1rem;flex-wrap:wrap;font-size:.95rem}
.stat span b{font-size:1.1rem}
.passlist{list-style:none;padding:0;margin:0}
.passlist li{margin:.35rem 0}
.passlist a{display:flex;gap:.7rem;align-items:center;text-decoration:none;padding:.5rem .7rem;border-radius:10px;background:var(--ct);border:2px solid transparent}
.passlist a:hover{border-color:var(--c)}
.passlist .num{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--c);color:#fff;font-weight:700}
.passlist .done .num{background:var(--ok)}
.passlist .meta{font-size:.9rem;color:var(--soft);display:block}
.wk{margin:1.1rem 0 .2rem;font-weight:700}
.step{background:var(--paper);border-radius:14px;padding:1rem 1.2rem;margin:0 0 1rem;border:2px solid var(--line);position:relative}
.step>h2{display:flex;gap:.6rem;align-items:center;font-size:1.25rem}
.step>h2 .sn{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--c);color:#fff;font-size:1rem;display:flex;align-items:center;justify-content:center}
.step.isdone>h2 .sn{background:var(--ok)}
.stepdone{margin-left:auto;font-size:.9rem;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.15rem .7rem;cursor:pointer;min-height:36px}
.stepdone[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tip{background:var(--ct);border-radius:10px;padding:.6rem .9rem;margin:.6rem 0}
textarea,input[type=text],input[type=number],select{font:inherit;font-size:1rem;width:100%;border:2px solid var(--line);border-radius:10px;padding:.5rem .7rem;background:var(--field);color:var(--ink)}
textarea{min-height:5.5rem;resize:vertical;line-height:1.5}
.qc{border-top:2px solid var(--line);padding:.8rem 0}
.qc:first-of-type{border-top:0}
.qc .qt{font-weight:500;margin:0 0 .4rem;display:flex;gap:.5rem;align-items:flex-start}
.qc .qt .from{font-size:.8rem;font-weight:400;color:var(--soft);white-space:nowrap}
.ans{background:var(--okt);border-radius:10px;padding:.6rem .9rem;margin:.5rem 0}
.ans p{margin:.2rem 0 .4rem}
.grade{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.grade button{font-size:.95rem;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.2rem .8rem;cursor:pointer;min-height:40px}
.grade button.on.g0{background:var(--ok);border-color:var(--ok);color:#fff}
.grade button.on.g1{background:var(--mid);border-color:var(--mid);color:#fff}
.grade button.on.g2{background:var(--bad);border-color:var(--bad);color:#fff}
.say{font-size:.9rem;border:2px solid var(--line);background:transparent;border-radius:999px;padding:.05rem .65rem;cursor:pointer;flex:none}
.pts{list-style:none;padding:0;margin:.4rem 0}
.pts li{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem .5rem;border-radius:8px;margin:.2rem 0}
.pts li.hit{background:var(--okt)}
.pts li .mk{flex:none;width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--soft);margin-top:.25rem;cursor:pointer;background:transparent;padding:0}
.pts li.hit .mk{background:var(--ok);border-color:var(--ok)}
.exl{display:flex;flex-wrap:wrap;gap:.5rem}
.exl a{text-decoration:none;border:2px solid var(--c);border-radius:10px;padding:.4rem .8rem;background:var(--ct);font-size:1rem}
.exl a.done{border-color:var(--ok)}
.exl a.done::before{content:"✓ ";color:var(--ok);font-weight:700}
/* exercises */
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 .9rem}
.tabs button{font-size:.95rem;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:.3rem .8rem;cursor:pointer;min-height:40px}
.tabs button[aria-pressed="true"]{background:var(--c,#3566B8);border-color:var(--c,#3566B8);color:#fff}
.grp{width:100%;font-size:.88rem;color:var(--soft);margin:.3rem 0 -.1rem}
.answer{display:flex;flex-wrap:wrap;gap:.4rem;min-height:3rem;padding:.5rem;border-radius:10px;border:2px dashed var(--line);margin:.6rem 0}
.answer span{background:var(--c);color:#fff;border-radius:8px;padding:.2rem .7rem;line-height:1.4}
.pool{display:flex;flex-wrap:wrap;gap:.5rem}
.pool button{font-size:1rem;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:.45rem .8rem;cursor:pointer;min-height:44px;text-align:left;line-height:1.35}
.pool button.wrong,.chip.wrong{border-color:var(--bad);animation:shake .3s}
.pool button.right{background:var(--ok);border-color:var(--ok);color:#fff}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.msg{font-weight:500;min-height:1.6rem}
.figscroll{overflow-x:auto;border-radius:10px;background:#fff;border:2px solid var(--line)}
.fig{position:relative;width:100%;margin:0 auto}
.fig img{display:block;width:100%;height:auto}
.zone{position:absolute;border:2px dashed #E08A1E;border-radius:6px;background:rgba(255,248,235,.97);display:flex;align-items:center;justify-content:center;
  font-size:12px;line-height:1.1;color:#1D2B3A;cursor:pointer;padding:0 3px;text-align:center;font-weight:600}
.zone.ok{border:2px solid #2E8B57;background:#E3F4EA;color:#1D5E3A}
.zone.shown{border:2px solid #7D8B99;background:#EEF1F4;color:#4A5A6B}
.zone.no{border-color:#C0392B;background:#FBE3E0;animation:shake .3s}
.picking .zone:not(.ok):not(.shown){background:rgba(232,240,252,.97);border-color:#3878B8}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0 .4rem}
.chip{font-size:1rem;border:2px solid var(--c,#E08A1E);background:var(--paper);color:var(--ink);border-radius:10px;padding:.4rem .75rem;cursor:grab;min-height:44px;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;line-height:1.35}
.chip.sel{background:var(--c,#E08A1E);color:#fff}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem;margin:1rem 0 .4rem}
.bucket{border:2px dashed var(--c);border-radius:12px;padding:.5rem;min-height:6rem;cursor:pointer;background:var(--ct)}
.bucket h3{margin:0 0 .4rem;font-size:1rem;text-align:center}
.bucket .in{font-size:.88rem;background:var(--ok);color:#fff;border-radius:8px;padding:.2rem .5rem;margin:.25rem 0;line-height:1.35}
.bucket.no{border-color:var(--bad);animation:shake .3s}
.picking2 .bucket{border-style:solid}
/* punnett */
.pun{display:grid;gap:4px;margin:.8rem 0;max-width:24rem}
.pun div{border:2px solid var(--line);border-radius:8px;min-height:3rem;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:1.05rem;background:var(--paper)}
.pun .h{background:var(--ct);border-color:var(--c)}
.pun .e{border-color:transparent;background:transparent}
.pun .cell{cursor:pointer;border-style:dashed}
.pun .cell.sel{border-color:#3878B8;border-style:solid;background:rgba(56,120,184,.12)}
.pun .cell.ok{border-color:var(--ok);border-style:solid;background:var(--okt)}
.pun .cell.no{border-color:var(--bad);animation:shake .3s}
.par{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;font-size:1.05rem}
.par b{font-size:1.2rem}
/* codon */
.dna{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;letter-spacing:.05em;word-break:break-word;background:var(--field);border-radius:8px;padding:.4rem .6rem;border:2px solid var(--line)}
.dna mark{background:#F2D06B;color:#1D2B3A;border-radius:3px}
.cods{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.cods label{display:flex;flex-direction:column;gap:.2rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem;align-items:flex-start}
.cods select{width:auto;min-width:8.5rem;font-family:inherit}
.cods select.ok{border-color:var(--ok);background:var(--okt)}
.cods select.no{border-color:var(--bad);background:var(--badt)}
.ctab{overflow-x:auto}
.ctab table{border-collapse:collapse;font-size:.85rem;font-family:ui-monospace,Menlo,Consolas,monospace}
.ctab td,.ctab th{border:1px solid var(--line);padding:.15rem .35rem;vertical-align:top;white-space:nowrap}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;font-size:1rem}
.cmp .lbl{color:var(--soft)}
.aa{display:inline-block;border-radius:6px;padding:0 .3rem;margin:.1rem}
.aa.diff{background:var(--badt);outline:2px solid var(--bad)}
.letters{display:flex;flex-wrap:wrap;gap:.25rem;margin:.5rem 0}
.letters button{min-width:2.2rem;min-height:2.4rem;border:2px solid var(--line);border-radius:6px;background:var(--paper);font-weight:700;cursor:pointer}
.words{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;letter-spacing:.08em}
/* pedigree */
.ped{background:#fff;border:2px solid var(--line);border-radius:10px;overflow-x:auto}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.9rem;color:var(--soft);margin:.4rem 0}
/* canvas */
.canv{border:2px solid var(--line);border-radius:10px;background:#fff;touch-action:none;display:block;width:100%;height:380px}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.tools button{min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--paper);cursor:pointer}
.tools button[aria-pressed="true"]{border-color:var(--ink)}
.kw{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.kw span{border-radius:999px;padding:.1rem .7rem;font-size:.92rem;border:2px solid var(--line)}
.kw span.hit{background:var(--okt);border-color:var(--ok)}
.kw span.miss{background:var(--midt);border-color:var(--mid)}
/* begrepp */
.term{border-left:6px solid var(--c);padding:.5rem .9rem;margin:.6rem 0;background:var(--ct);border-radius:0 10px 10px 0}
.term h3{margin:0;display:flex;gap:.6rem;align-items:center}
.term p{margin:.15rem 0}
.term .exm{color:var(--soft)}
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:.6rem}
.match>div{display:flex;flex-direction:column;gap:.5rem}
.match button{font-size:1rem;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:.5rem .7rem;cursor:pointer;line-height:1.4}
.match button.sel{border-color:#3878B8;background:rgba(56,120,184,.15)}
.match button.done{border-color:var(--ok);background:var(--okt);cursor:default}
.match button.wrong{border-color:var(--bad);animation:shake .3s}
.exq{font-size:1.2rem;font-weight:500;padding:1rem;border-radius:12px;background:var(--ct);margin:.4rem 0 .8rem}
.fcard{min-height:9rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-radius:14px;padding:1.2rem;margin:.6rem 0;cursor:pointer;border:3px solid var(--c);background:var(--ct);font-size:1.25rem;font-weight:500;width:100%;color:var(--ink)}
.fcard small{display:block;font-size:.9rem;color:var(--soft);font-weight:400;margin-top:.5rem}
.note{border:2px dashed var(--line);border-radius:12px;padding:.6rem .9rem;font-size:.98rem;color:var(--soft)}
.sync{font-size:.85rem;color:var(--soft)}
footer{color:var(--soft);font-size:.92rem;margin-top:2rem}
@media (max-width:520px){h1{font-size:1.65rem}.match{grid-template-columns:1fr 1.3fr}.match button{font-size:.9rem}body{font-size:1.05rem}}
.k-his{--c:#3566B8;--ct:rgba(53,102,184,0.1)}.k-del{--c:#8653B8;--ct:rgba(134,83,184,0.1)}.k-arv{--c:#B8661A;--ct:rgba(184,102,26,0.1)}.k-dna{--c:#2F8A5E;--ct:rgba(47,138,94,0.1)}.k-epi{--c:#B8467C;--ct:rgba(184,70,124,0.1)}.k-gte{--c:#13807A;--ct:rgba(19,128,122,0.1)}.k-rep{--c:#4A5A6B;--ct:rgba(74,90,107,0.1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .k-his{--c:#7FA6E8;--ct:rgba(127,166,232,0.14)}:root:not([data-theme="light"]) .k-del{--c:#B48BE3;--ct:rgba(180,139,227,0.14)}:root:not([data-theme="light"]) .k-arv{--c:#F0A452;--ct:rgba(240,164,82,0.14)}:root:not([data-theme="light"]) .k-dna{--c:#5CC08F;--ct:rgba(92,192,143,0.14)}:root:not([data-theme="light"]) .k-epi{--c:#EB86B6;--ct:rgba(235,134,182,0.14)}:root:not([data-theme="light"]) .k-gte{--c:#4FC4B8;--ct:rgba(79,196,184,0.14)}:root:not([data-theme="light"]) .k-rep{--c:#AAB8C5;--ct:rgba(170,184,197,0.14)}:root:not([data-theme="light"]) .btn.main,:root:not([data-theme="light"]) .passlist .num,:root:not([data-theme="light"]) .step>h2 .sn,:root:not([data-theme="light"]) .tabs button[aria-pressed="true"],:root:not([data-theme="light"]) .answer span,:root:not([data-theme="light"]) .chip.sel{color:#161E26}}
:root[data-theme="dark"] .k-his{--c:#7FA6E8;--ct:rgba(127,166,232,0.14)}:root[data-theme="dark"] .k-del{--c:#B48BE3;--ct:rgba(180,139,227,0.14)}:root[data-theme="dark"] .k-arv{--c:#F0A452;--ct:rgba(240,164,82,0.14)}:root[data-theme="dark"] .k-dna{--c:#5CC08F;--ct:rgba(92,192,143,0.14)}:root[data-theme="dark"] .k-epi{--c:#EB86B6;--ct:rgba(235,134,182,0.14)}:root[data-theme="dark"] .k-gte{--c:#4FC4B8;--ct:rgba(79,196,184,0.14)}:root[data-theme="dark"] .k-rep{--c:#AAB8C5;--ct:rgba(170,184,197,0.14)}:root[data-theme="dark"] .btn.main,:root[data-theme="dark"] .passlist .num,:root[data-theme="dark"] .step>h2 .sn,:root[data-theme="dark"] .tabs button[aria-pressed="true"],:root[data-theme="dark"] .answer span,:root[data-theme="dark"] .chip.sel{color:#161E26}
.k-cel{--c:#7A5A2E;--ct:rgba(122,90,46,.10)}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .k-cel{--c:#D9B27A;--ct:rgba(217,178,122,.14)}}:root[data-theme="dark"] .k-cel{--c:#D9B27A;--ct:rgba(217,178,122,.14)}

<script>
const D={"PASSES": [{"id": "p1", "n": 1, "c": "his", "day": "Lördag 14/11", "t": "Proteiner, DNA och RNA, genom och kromosomer", "lasa": [["Lärarens bok (VIVA)", "s. 118–129", "Huvudtext. Läs allt, även faktakollen i slutet av varje avsnitt."], ["Biologi Campus", "s. 146–151", "Genomet och genetikens historia (Mendel, Morgan, Avery, Watson och Crick, Franklin). Läs om du hinner."], ["Biologi Campus", "s. 164–165", "Hur DNA packas till kromosomer. Bilden på s. 165 är bra."]], "gissa": ["En människa och ett olivträd har båda 46 kromosomer. Varför är vi ändå så olika?", "Antalet kromosomer säger nästan ingenting. Det är ordningen på kvävebaserna i generna, alltså vilka proteiner som kan bildas, som avgör hur en organism blir."], "guide": ["Vilka fem sorters uppgifter proteiner har i kroppen.", "Vad en nukleotid består av, och hur A–T och G–C parar (Chargaffs regel).", "Skillnaden mellan DNA och RNA, och de fyra sorterna av RNA.", "Genom, gen, lokus, triplett, kromosom, histon, kromatin, centromer och telomer."], "punkter": [["Proteiner byggs av 20 olika aminosyror. Ordningen avgör proteinets funktion.", ["aminosyr"]], ["Proteiner sköter transport, kommunikation, kemiska reaktioner (enzymer), struktur och rörelse.", ["enzym|transport|struktur"]], ["En nukleotid består av socker, fosfatgrupp och kvävebas.", ["nukleotid", "fosfat|socker"]], ["A parar med T (två vätebindningar) och G med C (tre vätebindningar): komplementär basparning.", ["vätebind|komplementär|chargaff"]], ["RNA är enkelsträngat, har ribos och uracil (U) i stället för tymin.", ["ribos|uracil|enkel"]], ["mRNA är en kopia av genen, tRNA hämtar aminosyror, rRNA bygger ribosomer, mikroRNA styr proteinproduktionen.", ["trna|rrna|mikrorna"]], ["Bara cirka 1,5 % av DNA kodar för proteiner. Resten kallas ibland skräp-DNA.", ["1,5|skräp"]], ["DNA lindas runt histoner. Löst packat DNA kallas kromatin.", ["histon", "kromatin"]], ["Centromeren är kromosomens midja. Telomererna skyddar ändarna och blir kortare vid varje delning.", ["centromer|telomer"]]], "fragor": [["Vilka fem typer av uppgifter har proteiner? Ge ett exempel på varje.", ["Transport, till exempel hemoglobin som transporterar syre.", "Kommunikation, till exempel antikroppar och proteiner som styr vilka gener som används.", "Kemiska reaktioner, till exempel enzymet laktas som bryter ner mjölksocker.", "Struktur, till exempel proteiner som håller ihop celler.", "Rörelse, till exempel aktin i musklerna."]], ["Vad skiljer olika proteiner från varandra?", ["Vilka aminosyror de består av, hur många av varje och i vilken ordning de sitter."]], ["Vilka tre delar består en nukleotid av?", ["En sockermolekyl (deoxiribos i DNA, ribos i RNA), en fosfatgrupp och en kvävebas."]], ["Den ena DNA-kedjan har sekvensen GCATTGCA. Hur ser den andra kedjan ut?", ["CGTAACGT. A parar alltid med T och G med C."]], ["I en DNA-molekyl är 30 % av baserna adenin. Hur stor andel är guanin?", ["Adenin = tymin = 30 %, alltså 60 % tillsammans. Kvar blir 40 % som delas lika mellan guanin och cytosin: 20 % guanin."]], ["Varför är DNA med många G–C-par stabilare än DNA med många A–T-par?", ["G och C hålls ihop av tre vätebindningar, A och T bara av två. Fler bindningar gör molekylen stabilare."]], ["Varför tror man att det är DNA och inte RNA som bär arvet?", ["DNA är dubbelsträngat och därför mycket stabilare än RNA. Det gör att informationen bevaras."]], ["Vad är skillnaden mellan en kromosom och en DNA-molekyl?", ["En kromosom består av en DNA-molekyl plus de proteiner (histoner) som DNA:t är lindat runt."]], ["Vad skulle hända om man tog bort alla histoner i en cell?", ["DNA:t skulle inte kunna packas ihop. De ungefär två meter DNA som finns i varje cell skulle inte få plats i cellkärnan, och kromosomerna skulle inte kunna fördelas vid celldelning."]], ["Förklara begreppen genom, lokus och triplett.", ["Genom: all arvsmassa i en organism.", "Lokus: den plats på DNA-molekylen där en viss gen sitter.", "Triplett: tre kvävebaser i rad i DNA, som motsvarar en aminosyra."]], ["Vad visade Averys försök 1944?", ["Att det är DNA, inte proteiner, som bär arvet. DNA från en avdödad sjukdomsframkallande bakterie kunde göra en ofarlig bakterie sjukdomsframkallande."]], ["Vad skiljer RNA från DNA?", ["RNA är enkelsträngat, DNA dubbelsträngat.", "RNA har sockret ribos, DNA har deoxiribos.", "RNA har basen uracil (U) i stället för tymin (T)."]], ["Vilka sorters RNA finns det och vad gör de?", ["mRNA: en kopia av en gen som används som mall för proteinet.", "tRNA: hämtar aminosyror till ribosomen.", "rRNA: bygger upp ribosomerna tillsammans med proteiner.", "mikroRNA: reglerar translationen genom att blockera vissa mRNA."]], ["Hur kunde Watson och Crick lista ut hur DNA ser ut, trots att de inte gjorde egna experiment?", ["De analyserade andras resultat: Chargaffs regel (A = T, G = C) och Rosalind Franklins röntgenbild som visade att DNA är en helix. Med modeller testade de idéer tills allt stämde. De fick Nobelpris 1962."]]], "mc": [["Vilken bas finns i RNA men inte i DNA?", ["Uracil", "Tymin", "Adenin", "Guanin"], 0, "RNA har uracil (U) i stället för tymin (T)."], ["Hur många vätebindningar finns mellan G och C?", ["2", "3", "1", "4"], 1, "G–C har tre vätebindningar, A–T har två."], ["Vilken sortens RNA bygger upp ribosomerna?", ["mRNA", "tRNA", "rRNA", "mikroRNA"], 2, "rRNA bygger tillsammans med proteiner upp ribosomerna."], ["Ungefär hur stor del av människans DNA kodar för proteiner?", ["1,5 %", "15 %", "50 %", "98 %"], 0, "Bara ungefär 1,5 % är proteinkodande."], ["Vad är en telomer?", ["Midjan där kromatiderna sitter ihop", "En icke-kodande skyddsände på DNA-molekylen", "Ett protein som DNA lindas runt", "En sorts RNA"], 1, "Telomererna är som plastskydden på skosnören. Centromeren är midjan."], ["Ena DNA-kedjan består till 20 % av cytosin. Hur många procent guanin har den komplementära kedjan?", ["20 %", "30 %", "40 %", "80 %"], 0, "Varje C i ena kedjan står mittemot ett G i den andra, så den andra kedjan har 20 % G."]], "ovn": ["s_protein", "f_dna", "f_bas", "o_storlek", "f_krom", "o_tid", "avery"]}, {"id": "p2", "n": 2, "c": "del", "day": "Söndag 15/11", "t": "Replikation, cellcykeln och mitos", "lasa": [["Lärarens bok (VIVA)", "s. 130–133", "Replikationen."], ["Lärarens bok (VIVA)", "s. 146–155", "Celldelning: binär fission, cellcykeln och mitosens faser. Gör faktakollen på s. 152 och 154–155."], ["Biologi Campus", "s. 154–157 och 185", "Samma sak med mer detaljer, till exempel Okazaki-fragment och G0. Läs s. 185 om du vill förstå replikationen på djupet."]], "gissa": ["Innan en cell delar sig måste allt DNA kopieras. Hur kan cellen veta exakt vilka baser som ska sitta i den nya kedjan?", "Den gamla kedjan fungerar som mall. Eftersom A alltid parar med T och G med C finns det bara en möjlig bas som passar mittemot varje bas."], "guide": ["Replikationens steg: helikas, fria nukleotider, DNA-polymeras, systerkromatider.", "Cellcykelns delar: interfas (G0, G1, S, G2) och M-fas.", "Mitosens fyra faser och vad som händer i varje.", "Binär fission hos bakterier."], "punkter": [["Helikas öppnar DNA:t genom att bryta vätebindningarna mellan basparen.", ["helikas"]], ["Fria nukleotider basparar med de gamla kedjorna, och DNA-polymeras kopplar ihop dem.", ["polymeras"]], ["Replikationen är semikonservativ: varje ny DNA-molekyl har en gammal och en ny kedja.", ["semikonserv|gammal"]], ["Efter replikationen består kromosomen av två systerkromatider som sitter ihop i centromeren.", ["systerkromatid"]], ["Cellcykeln: interfas (G1 tillväxt, S replikation, G2 mer tillväxt) och M-fas (mitos). G0 är normalfasen.", ["g1|interfas", "s-fas|syntes"]], ["Mitosens faser: profas, metafas, anafas och telofas.", ["profas", "metafas", "anafas", "telofas"]], ["Mikrotubuli (kärnspolar) fäster i centromererna och drar isär systerkromatiderna i anafasen.", ["mikrotubuli|kärnspol"]], ["Bakterier delar sig genom binär fission.", ["binär"]]], "fragor": [["Var och när sker replikationen?", ["I cellkärnan (hos eukaryoter), under S-fasen i interfasen. Den sker innan en cell delar sig, både vid mitos och inför bildandet av könsceller."]], ["Beskriv replikationens steg i ordning.", ["1. Helikas bryter vätebindningarna så att kedjorna separeras.", "2. Fria nukleotider basparar med baserna på respektive kedja.", "3. DNA-polymeras kopplar ihop nukleotiderna till en ny kedja.", "4. Två nya DNA-molekyler har bildats, som sitter ihop i centromeren som systerkromatider."]], ["Vad menas med att replikationen är semikonservativ?", ["Varje ny DNA-molekyl består av en gammal kedja som fungerat som mall och en nybyggd kedja. Hälften av den gamla molekylen behålls alltså i varje ny."]], ["Hur många DNA-molekyler, DNA-kedjor och systerkromatider består en replikerad kromosom av?", ["Två DNA-molekyler, alltså fyra DNA-kedjor, och två systerkromatider."]], ["Varför behöver cellen ett system för korrekturläsning när DNA kopieras?", ["Vid varje kopiering av människans arvsmassa uppstår uppskattningsvis 120 000 fel. Enzymer upptäcker och rättar de flesta. De fel som inte rättas blir mutationer."]], ["Vad är syftet med mitos?", ["Att bilda två identiska celler. Det behövs när vi växer, när sår läker och när gamla celler ska ersättas. Encelliga eukaryoter, till exempel amöbor, förökar sig genom mitos."]], ["Beskriv cellcykelns faser.", ["G1 (tillväxtfas): proteinsyntes, organellerna fördubblas.", "S (syntesfas): DNA replikeras, 46 → 92.", "G2 (kontrollfas): DNA:t kontrolleras och fel repareras.", "M (mitos): cellen delar sig.", "G0 är normalfasen när cellen inte förbereder någon delning. G1, S och G2 kallas tillsammans interfas."]], ["Beskriv mitosens faser.", ["Profas: kromosomerna packas ihop, kärnmembranet löses upp och kärnspolar bildas.", "Metafas: kromosomerna ställer sig på en linje i mitten av cellen.", "Anafas: systerkromatiderna dras isär mot var sin ände.", "Telofas: nya kärnmembran bildas runt två nya kärnor.", "Cytokines: cellen snörs av till två dotterceller."]], ["Vad får systerkromatiderna att separera och flytta till var sin del av cellen under anafasen?", ["Kärnspolar, proteintrådar som utgår från centriolerna, fäster vid centromeren och drar isär systerkromatiderna."]], ["En cell med 40 kromosomer går igenom mitos. Hur många DNA-molekyler finns i profasen, i metafasen och i varje dottercell efter delningen?", ["Profas och metafas: 80 DNA-molekyler, eftersom alla 40 kromosomer har replikerats och består av två systerkromatider.", "Efter delningen: 40 DNA-molekyler i varje dottercell."]], ["Vad är binär fission?", ["Bakteriers och arkéers celldelning. Den enda, cirkulära kromosomen kopieras och cellen delar sig i två likadana dotterceller. Det är asexuell förökning och kan gå mycket snabbt."]], ["Ett ämne hindrar att mikrotubuli bildas. Hur kan det leda till celler med dubbelt så många kromosomer?", ["Utan mikrotubuli kan systerkromatiderna inte dras isär i anafasen. DNA:t har redan replikerats, men cellen delar inte upp det, så cellen får dubbla kromosomuppsättningen. Det används inom växtförädling."]], ["Vad är mitosindex och varför används det vid cancer?", ["Andelen celler i ett prov som befinner sig i mitos. Cancerceller delar sig okontrollerat, så ett högt mitosindex visar en snabbväxande tumör. Man kan också se om behandlingen bromsar delningen."]]], "mc": [["Vilket enzym bryter vätebindningarna mellan DNA-kedjorna?", ["DNA-polymeras", "Helikas", "RNA-polymeras", "Telomeras"], 1, "Helikas fungerar som en sax som klipper upp vätebindningarna."], ["I vilken fas av cellcykeln replikeras DNA?", ["G1", "S", "G2", "M"], 1, "S står för syntes, då byggs nya DNA-kedjor."], ["När dras systerkromatiderna isär?", ["Profas", "Metafas", "Anafas", "Telofas"], 2, "I anafasen dras de mot var sin ände av cellen."], ["En cell med 20 kromosomer går igenom mitos. Vad blir resultatet?", ["1 cell med 20", "2 celler med 10", "2 celler med 20", "4 celler med 10"], 2, "Mitos ger två identiska celler med samma antal kromosomer som modercellen."], ["I ett prov med 1 000 celler är 32 i profas, 41 i metafas, 11 i anafas och 20 i telofas. Vad är mitosindex?", ["10,4 %", "4,1 %", "1,04 %", "41 %"], 0, "32 + 41 + 11 + 20 = 104 celler i mitos. 104 / 1000 = 0,104 = 10,4 %."], ["Vid vilket tillfälle sker INTE mitos?", ["När ett sår läker", "När ett barn växer", "När en spermie bildas", "När tarmceller ersätts"], 2, "Spermier bildas genom meios."], ["En mutation uppstår i ena kedjan när DNA:t replikeras. Hamnar den i båda dottercellerna?", ["Ja, alltid", "Nej, bara i den ena", "Nej, i ingen", "Bara om den är dominant"], 1, "Varje dottercell får en av de två nya DNA-molekylerna, och felet finns bara i den ena."]], "ovn": ["o_repl", "f_repl", "o_cykel", "f_cykel", "o_mitos", "f_mitos", "rita_mitos"]}, {"id": "p3", "n": 3, "c": "dna", "day": "Söndag 15/11", "t": "Proteinsyntesen: transkription och translation", "lasa": [["Lärarens bok (VIVA)", "s. 134–141", "Transkription, splitsning, translation och styrning. Använd kodontabellen på s. 138."], ["Biologi Campus", "s. 186–191", "Den genetiska koden och kodonsolen. Läs s. 189–191 om ribosomens platser E, P och A."]], "gissa": ["Ett protein byggs av 20 sorters aminosyror, men DNA har bara 4 sorters baser. Hur kan 4 bokstäver räcka för 20 aminosyror?", "Baserna läses tre och tre. Med fyra baser på tre platser finns 4 × 4 × 4 = 64 kombinationer, vilket räcker gott och väl till 20 aminosyror plus start och stopp."], "guide": ["Transkriptionens steg: promotor, RNA-polymeras, mall-kedja, terminator.", "Splitsning: introner och exoner.", "Translationen: kodon, antikodon, tRNA, ribosomens säten och stoppkodon.", "Hur proteinproduktionen kan styras."], "punkter": [["Transkriptionen sker i cellkärnan: RNA-polymeras binder till promotorn och skriver av genen till RNA.", ["transkription", "polymeras|promotor"]], ["Vid splitsning klipps intronerna bort och exonerna fogas ihop till färdigt mRNA.", ["splits", "intron|exon"]], ["Translationen sker i ribosomen: mRNA läses av ett kodon (tre baser) i taget.", ["translation", "ribosom"]], ["tRNA har ett antikodon som passar mot kodonet och bär rätt aminosyra.", ["antikodon|trna"]], ["AUG är startkodon (metionin). Det finns tre stoppkodon.", ["aug|start", "stopp"]], ["64 kodon men 20 aminosyror, så de flesta aminosyror har flera kodon.", ["64|20"]], ["Proteinproduktionen kan styras av hur DNA:t är packat, av transkriptionsfaktorer och av mikroRNA.", ["transkriptionsfaktor|mikrorna"]]], "fragor": [["Var sker transkriptionen, och vad bildas?", ["I cellkärnan. Enzymet RNA-polymeras kopierar genen till en pre-mRNA-molekyl, en arbetskopia av genen."]], ["Vad är en transkriptionsfaktor?", ["Ett protein som binder till en gens promotor och underlättar eller hindrar att RNA-polymeras börjar transkribera genen. På så sätt styrs hur mycket mRNA som bildas."]], ["Vad är splitsning?", ["När pre-mRNA klipps itu. De delar som inte används, intronerna, klipps bort, och de delar som kodar för proteinet, exonerna, fogas ihop till färdigt mRNA. Exonerna kan fogas ihop på olika sätt, så en gen kan ge flera olika proteiner."]], ["Beskriv translationen.", ["mRNA binds till en ribosom. Ett tRNA med rätt antikodon och en aminosyra binder till kodonet på plats A. Aminosyran kopplas till kedjan, och ribosomen flyttar fram ett kodon i taget (A → P → E). När ett stoppkodon kommer frigörs proteinet, som veckas till sin färdiga form."]], ["Vilken molekyl bildas efter transkription och vilken efter translation?", ["Transkription ger mRNA (först pre-mRNA). Translation ger ett protein, alltså en kedja av aminosyror."]], ["DNA-mallen har sekvensen TACGGATTT. Vilket mRNA bildas, och vilka aminosyror kodar det för?", ["mRNA: AUG CCU AAA (komplementärt till mallen, med U i stället för T).", "Aminosyror: metionin – prolin – lysin."]], ["Hur många kvävebaser behövs för att koda för ett protein med 60 aminosyror?", ["60 × 3 = 180 baser, plus tre baser för stoppkodonet, alltså 183."]], ["En DNA-mall innehåller sekvensen AGT. Vilket kodon får mRNA:t, och vilket antikodon har tRNA-molekylen som binder till det?", ["mRNA-kodon: UCA. tRNA-antikodon: AGU, alltså samma bokstäver som DNA-mallen men med U i stället för T."]], ["Hur kan människan bilda cirka 100 000 olika proteiner med bara cirka 20 000 gener?", ["Vid splitsningen kan exonerna fogas ihop på olika sätt, så en gen kan ge flera olika mRNA och därmed flera olika proteiner."]], ["Alla celler i kroppen har samma gener. Varför ser en hjärncell och en muskelcell ändå så olika ut?", ["Olika gener uttrycks i olika celler. Cellerna får olika signaler och bildar därför olika proteiner."]], ["Beskriv tre sätt som proteinproduktionen kan styras på.", ["1. Hårt packat DNA kan inte läsas av RNA-polymeras.", "2. Transkriptionsfaktorer kan göra det lättare eller svårare för RNA-polymeras att binda.", "3. MikroRNA kan binda till mRNA och hindra att det används av ribosomen."]], ["En forskare för in en mänsklig gen i en bakterie, men bakterien bildar ett mycket kortare protein som inte fungerar. Ge en tänkbar förklaring.", ["Bakterier saknar introner och kan inte splitsa. Intronerna läses då som om de var en del av genen, och ett stoppkodon i en intron kan avsluta translationen för tidigt."]]], "mc": [["Vilken ordning är rätt?", ["DNA → aminosyra → mRNA → protein", "DNA → mRNA → aminosyra → protein", "mRNA → DNA → aminosyra → protein", "aminosyra → DNA → mRNA → protein"], 1, "Genen skrivs av till mRNA, som översätts till en kedja av aminosyror."], ["Var sker translationen?", ["I cellkärnan", "I ribosomen", "I mitokondrien", "I kärnmembranet"], 1, "Ribosomerna finns i cytoplasman."], ["Vad kodar AUG för?", ["Stopp", "Metionin och start", "Leucin", "Inget"], 1, "AUG är startkodon och kodar för metionin."], ["Vilka delar av genen klipps bort vid splitsning?", ["Exoner", "Introner", "Promotorn", "Kodon"], 1, "Intronerna klipps bort, exonerna fogas ihop."], ["mRNA-kodonet GAA. Vilket antikodon har tRNA:t?", ["CTT", "CUU", "GAA", "UUC"], 1, "Antikodonet är komplementärt till kodonet och har U i stället för T: CUU."], ["Vad heter DNA-sekvensen där RNA-polymeras binder när transkriptionen börjar?", ["Terminator", "Promotor", "Centromer", "Kodon"], 1, "Promotorn är startsekvensen. Terminatorn signalerar stopp."], ["Vilka sorters RNA bildas från DNA?", ["Bara mRNA", "mRNA och tRNA", "mRNA, rRNA, tRNA och mikroRNA", "Bara rRNA"], 2, "Gener beskriver även hur rRNA, tRNA och mikroRNA ska byggas."]], "ovn": ["o_prot", "o_transl", "f_prot", "f_ribo", "mutlab", "rita_prot", "fk_prot"]}, {"id": "p4", "n": 4, "c": "dna", "day": "Måndag 16/11", "t": "Mutationer", "lasa": [["Lärarens bok (VIVA)", "s. 142–145", "Gen- och kromosommutationer, substitution, insertion och deletion, sicklecellanemi. Gör faktakollen."], ["Biologi Campus", "s. 160–163 och 192", "Mutationer, telomerer och programmerad celldöd. Exemplet HAN SER SJU GRÅ FÅR på s. 192."]], "gissa": ["Vid varje kopiering av arvsmassan uppstår tusentals fel. Varför blir vi ändå inte sjuka hela tiden?", "Enzymer rättar de flesta fel. Resten hamnar oftast i DNA som inte kodar för något, i gener som inte används i just den cellen, eller ger samma aminosyra (tyst mutation)."], "guide": ["Skillnaden mellan genmutation och kromosomal mutation.", "Substitution, insertion och deletion: vilken ger störst effekt?", "Sicklecellanemi: CTC → CAC i DNA, GAG → GUG i mRNA, glutaminsyra → valin.", "Mutationer i kroppsceller jämfört med i könsceller."], "punkter": [["Genmutationer ändrar nukleotidsekvensen. Kromosomala mutationer påverkar större delar eller hela kromosomer.", ["genmutation|kromosomal"]], ["Kromosomala mutationer: fler eller färre kromosomer, translokation och duplikation.", ["translokation|duplikation"]], ["Genmutationer: substitution (basparsutbyte), insertion (tillägg) och deletion (bortfall).", ["substitution|insertion|deletion"]], ["Insertion och deletion förskjuter avläsningen, vilket ger störst effekt.", ["förskjut"]], ["En tyst mutation ger samma aminosyra och påverkar inte proteinet.", ["tyst"]], ["Mutationer orsakas av fel vid replikationen, joniserande strålning (till exempel UV) och vissa kemikalier.", ["uv|strålning|kemikal"]], ["Mutationer i könsceller kan ärvas, i kroppsceller bara påverka individen (till exempel cancer).", ["könscell", "cancer|kroppscell"]]], "fragor": [["Vad är skillnaden mellan en genmutation och en kromosomal mutation?", ["En genmutation ändrar nukleotidsekvensen i en gen, till exempel en enda bas. En kromosomal mutation påverkar hela eller stora delar av kromosomer: fler eller färre kromosomer, translokation eller duplikation."]], ["Vad är translokation och duplikation?", ["Translokation: en bit av en kromosom flyttas till en annan kromosom.", "Duplikation: en bit av en kromosom kopieras, så att gener finns i flera kopior."]], ["Vilken mutation påverkar proteinet mest: ett basparsutbyte eller ett tillägg? Motivera.", ["Oftast ett tillägg (eller bortfall). Då förskjuts avläsningen, så alla kodon efter mutationen blir fel. Ett basparsutbyte ändrar högst en aminosyra, och ibland ingen alls."]], ["En mutation påverkar inte proteinet alls. Ge tre möjliga förklaringar.", ["Mutationen är tyst, det nya kodonet ger samma aminosyra.", "Den sitter i icke-kodande DNA.", "Genen används inte i den cellen."]], ["DNA-tripletten TCG blir CCG efter ett basparsutbyte. Vilken följd får det?", ["Mallen TCG ger mRNA-kodonet AGC (serin). CCG ger GGC (glycin). Serin byts mot glycin, vilket kan påverka proteinets form och funktion."]], ["Varför ökar risken för cancer med åldern?", ["Det krävs flera mutationer i flera olika gener som styr celldelningen innan en cell börjar dela sig okontrollerat. Med åren hinner fler mutationer samlas."]], ["Varför kan en mutation vid replikationen inför meios få större följder än en inför mitos?", ["Inför meios hamnar mutationen i en könscell. Ett barn som bildas av den cellen får mutationen i alla sina celler, även sina könsceller, så den kan föras vidare i släkten."]], ["Vad är sicklecellanemi, och hur hänger det ihop med en mutation?", ["En blodsjukdom där tripletten GAG ändrats till GTG i genen för hemoglobin. Glutaminsyra byts då mot valin, och de röda blodkropparna blir deformerade och sämre på att transportera syre."]], ["Ge exempel på en mutation som kan vara fördelaktig.", ["En mutation som ger motståndskraft mot hiv.", "Anlag för sicklecellanemi, som ger skydd mot malaria.", "Vissa vita blodkroppar genomgår mutationer som gör dem bättre på att bekämpa sjukdomar."]], ["Vilken betydelse har telomererna?", ["Telomererna sitter längst ut på kromosomerna och skyddar dem från skador. De kortas vid varje celldelning, vilket delvis förklarar att celler har begränsad livslängd och att vi åldras. Enzymet telomeras kan förlänga dem, och en hälsosam livsstil verkar hjälpa."]], ["Är mutationer bra eller dåliga? Motivera.", ["Både och. De flesta har ingen effekt och vissa är skadliga, till exempel de som orsakar sjukdomar eller cancer. Men mutationer skapar nya alleler och genetisk variation, vilket är grunden för evolutionen. Några är fördelaktiga, som skydd mot malaria eller hiv."]]], "mc": [["Vilken mutation förskjuter avläsningen av tripletterna?", ["Substitution", "Insertion", "Tyst mutation", "Duplikation"], 1, "Insertion och deletion förskjuter läsramen."], ["Vid sicklecellanemi ändras ett kodon från GAG till GUG. Vilken aminosyra byts?", ["Valin mot glutaminsyra", "Glutaminsyra mot valin", "Leucin mot valin", "Ingen, den är tyst"], 1, "GAG = glutaminsyra, GUG = valin."], ["Kodonet CGG blir CGC. Båda kodar för arginin. Vad kallas det?", ["Parallellförskjutning", "Tyst mutation", "Translokation", "Deletion"], 1, "Samma aminosyra, alltså en tyst mutation."], ["Vilken är en kromosomal mutation?", ["Basparsutbyte", "Translokation", "Insertion av en bas", "Deletion av en bas"], 1, "Translokation flyttar en bit kromosom."], ["Vilken miljöfaktor kan orsaka mutationer?", ["UV-strålning", "Kyla", "Sömnbrist", "Socker"], 0, "Joniserande strålning som UV och vissa kemikalier."], ["Var måste en mutation finnas för att kunna ärvas?", ["I en hudcell", "I en könscell", "I en muskelcell", "I en nervcell"], 1, "Bara mutationer i könsceller förs vidare."]], "ovn": ["mutlab", "s_muttyp", "s_mutkons", "s_arvs"]}, {"id": "p5", "n": 5, "c": "del", "day": "Måndag 16/11", "t": "Homologa kromosomer, meios, kön och kromosomavvikelser", "lasa": [["Lärarens bok (VIVA)", "s. 156–165", "Homologa kromosomer, haploid och diploid, SRY-genen, meios, kromosomavvikelser och polyploidi. Gör faktakollen."], ["Biologi Campus", "s. 158–159 och 166–169", "Meios med bilder, kromosomavvikelser och kön. Läs om du hinner."]], "gissa": ["Syskon har samma föräldrar men kan vara väldigt olika. Varför?", "Vid meiosen byter homologa kromosomer bitar (överkorsning), och slumpen avgör vilken kromosom i varje par som hamnar i vilken könscell. Med 23 par finns över 8 miljoner kombinationer, och då har vi ändå inte räknat med överkorsningen."], "guide": ["Homologa kromosomer, lokus, allel, homozygot och heterozygot.", "Haploid och diploid, autosomer och könskromosomer, SRY-genen.", "Meios I och meios II, och hur meios skiljer sig från mitos.", "Turners, Klinefelters och Downs syndrom, och polyploidi."], "punkter": [["Homologa kromosomer är ett par, en från ägget och en från spermien, med samma gener på samma lokus.", ["homolog"]], ["Kroppsceller är diploida (2n = 46) och könsceller haploida (n = 23).", ["diploid|haploid"]], ["Människan har 22 par autosomer och ett par könskromosomer. X och Y är inte homologa.", ["autosom"]], ["SRY-genen på Y-kromosomen styr utvecklingen i manlig riktning.", ["sry"]], ["Meios I separerar de homologa kromosomerna, meios II systerkromatiderna. Resultatet blir fyra haploida celler.", ["meios", "fyra|haploid"]], ["Överkorsning sker i profas I. Slumpvis fördelning i metafas I ger 2²³ ≈ 8,4 miljoner kombinationer.", ["överkorsning"]], ["Kromosomavvikelser: Turner (X0), Klinefelter (XXY) och Downs syndrom (trisomi 21).", ["turner|klinefelter|downs|trisomi"]], ["Polyploidi betyder fler än två kromosomuppsättningar och är vanligt hos växter.", ["polyploid"]]], "fragor": [["Vad är homologa kromosomer?", ["Ett kromosompar där den ena kommer från ägget och den andra från spermien. De är lika stora, har centromeren på samma plats och motsvarande gener på samma lokus, men kan ha olika alleler."]], ["Är följande celler haploida eller diploida: äggcell, hudcell, spermie, befruktat ägg?", ["Äggcell: haploid. Hudcell: diploid. Spermie: haploid. Befruktat ägg: diploid."]], ["Hur många kromosomer finns i en hudcell och i en spermie hos en människa?", ["Hudcell: 46. Spermie: 23."]], ["Beskriv vad som händer i meios I och meios II.", ["Meios I: de homologa kromosomerna parar ihop sig, överkorsning sker, och kromosomerna i varje par dras till var sin cell. Det bildas två haploida celler med replikerade kromosomer.", "Meios II: systerkromatiderna separeras, ungefär som i mitos. Det bildas totalt fyra haploida celler."]], ["Nämn tre skillnader mellan mitos och meios.", ["Mitos är en delning, meios två.", "Mitos ger diploida celler, meios haploida.", "I meios sker överkorsning, och dottercellerna får olika genotyp. I mitos blir de identiska."]], ["När separeras de homologa kromosomerna, och när systerkromatiderna?", ["Homologa kromosomer: i anafas I av meiosen.", "Systerkromatider: i anafas II av meiosen, och i mitosens anafas."]], ["Varför leder sexuell förökning till variation?", ["Överkorsning och slumpvis fördelning av kromosomerna vid meiosen ger nya kombinationer i varje könscell. Sedan avgör slumpen vilken spermie som befruktar vilket ägg."]], ["Varför kan en person med det biologiska könet kvinna ha könskromosomerna XY?", ["SRY-genen kan saknas eller vara skadad på Y-kromosomen. Utan den utvecklas fostret i kvinnlig riktning trots XY."]], ["Hur kan en kromosomavvikelse som Downs syndrom uppstå?", ["Om kromosomerna i ett par inte dras isär under meios I (eller systerkromatiderna i meios II) får en könscell en kromosom för mycket. Befruktas den får barnet tre exemplar av kromosomen, till exempel kromosom 21."]], ["Varför kan personer med Turners syndrom inte få egna biologiska barn?", ["De har bara en X-kromosom (X0). Det behövs två X-kromosomer för att äggstockar ska bildas under fosterutvecklingen."]], ["Beskriv hur könet bestäms hos olika organismgrupper.", ["Människa och andra däggdjur: hanen XY, honan XX.", "Fåglar och reptiler: hanen ZZ, honan ZW.", "Bin, getingar och myror: hanar har en enkel kromosomuppsättning (n), honor en dubbel (2n).", "Mississippialligatorn: temperaturen avgör, under 27 °C blir det honor och över 32 °C hanar."]]], "mc": [["Hur många kromosomer finns i en spermie från en människa?", ["46", "44", "23", "22"], 2, "Könsceller är haploida, n = 23."], ["När separeras de homologa kromosomerna?", ["Mitosens anafas", "Meios I", "Meios II", "Interfasen"], 1, "I anafas I dras kromosomerna i varje par isär."], ["Vilket påstående stämmer?", ["X och Y är homologa", "Homologa kromosomer bildas vid replikation", "Kromosomerna i ett homologt par ärvs från två olika individer", "Homologa kromosomer har alltid samma alleler"], 2, "En från mamma, en från pappa. X och Y är inte homologa."], ["Hur många könsceller bildas av en cell som genomgår meios?", ["1", "2", "4", "8"], 2, "Två delningar ger fyra celler."], ["Vilken kromosomuppsättning har Klinefelters syndrom?", ["X0", "XXY", "XYY", "Tre kromosom 21"], 1, "XXY, oftast nedsatt fertilitet."], ["Hur många kombinationer kan 23 kromosompar ge bara genom slumpvis fördelning?", ["46", "23²", "2²³ ≈ 8,4 miljoner", "1 miljard"], 2, "Varje par kan hamna på två sätt: 2²³."], ["Ärtplantor har 14 kromosomer i kroppscellerna. Hur många finns i pollenkornets könsceller?", ["28", "14", "7", "3"], 2, "Haploida könsceller: 14 / 2 = 7."]], "ovn": ["o_meios", "s_mitmei", "s_hap", "f_homolog", "s_kromtal", "fk_mitmei"]}, {"id": "p6", "n": 6, "c": "arv", "day": "Tisdag 17/11", "t": "Mendel, korsningsscheman och ärftliga sjukdomar", "lasa": [["Lärarens bok (VIVA)", "s. 166–173", "Mendel, korsningsscheman, autosomalt recessiva och dominanta sjukdomar, X-bundna sjukdomar. Gör faktakollen på s. 169 och 173."], ["Biologi Campus", "s. 172–173 och 178–182", "Dominant och recessiv, släkttavlor, Mendels lagar och dihybrid nedärvning."]], "gissa": ["Två friska föräldrar får ett barn med cystisk fibros. Hur kan det hända?", "Båda föräldrarna är bärare (Aa) av den recessiva allelen. Om barnet får a från båda blir det aa och sjukt. Risken är 25 % för varje barn."], "guide": ["Mendels försök och slutsatser: dominant och recessiv, segregation och oberoende nedärvning.", "Att rita och läsa ett korsningsschema, och klyvningstalen 3:1 och 9:3:3:1.", "Autosomalt recessiva (cystisk fibros, PKU) och dominanta (Huntington) sjukdomar.", "X-bundna sjukdomar och varför de drabbar män oftare."], "punkter": [["Mendel korsade ärtplantor och kom fram till dominanta och recessiva anlag.", ["mendel"]], ["Mendels första lag (segregation): alleler i ett par separeras när könsceller bildas.", ["segregation|separer"]], ["Mendels andra lag: olika egenskaper ärvs oberoende av varandra.", ["oberoende"]], ["Tt × Tt ger 1 TT : 2 Tt : 1 tt, alltså klyvningstalet 3:1. Två gener ger 9:3:3:1.", ["3:1|9:3:3:1"]], ["Cystisk fibros och PKU ärvs autosomalt recessivt, Huntingtons sjukdom autosomalt dominant.", ["cystisk|pku|huntington"]], ["I en släkttavla (pedigree) är kvinnor cirklar och män kvadrater, ifyllda är sjuka.", ["pedigree|släkttavla"]], ["X-bundna recessiva sjukdomar som blödarsjuka och färgblindhet drabbar oftast män, eftersom de bara har ett X.", ["x-bund|blödar|färgblind"]]], "fragor": [["Beskriv Mendels försök med gula och gröna ärtor.", ["Han korsade plantor med gula ärtor (GG) med plantor med gröna (gg). Alla i F1 fick gula ärtor (Gg).", "När F1 fick självbefrukta sig fick ungefär en fjärdedel av F2 gröna ärtor igen, förhållandet 3:1."]], ["Vad är ett klyvningstal? Ge exempel.", ["Förhållandet mellan antalet individer med olika fenotyper. Mendel fick 6 022 gula och 2 001 gröna ärtor, 6 022 / 2 001 ≈ 3,01, alltså 3:1. Vid dihybrid nedärvning blir klyvningstalet 9:3:3:1."]], ["Beskriv Mendels två lagar.", ["Första lagen (segregation): gener finns i par, man ärver en allel från varje förälder, och allelerna separeras när könsceller bildas.", "Andra lagen (oberoende nedärvning): olika egenskaper ärvs oberoende av varandra."]], ["Hos bananflugor är grå kropp (G) dominant och svart (g) recessiv. En heterozygot grå fluga parar sig med en svart. Hur stor andel av avkomman blir svart?", ["Gg × gg ger Gg, Gg, gg, gg. Hälften, alltså 50 %, blir svarta."]], ["Ett vitt marsvin (albino, aa) paras med ett svart och får 12 svarta ungar. Med ett annat svart marsvin blir det 7 svarta och 5 vita. Vilka genotyper har föräldrarna?", ["Det vita marsvinet är aa. Det första svarta är troligen AA, eftersom alla ungar blev svarta (Aa). Det andra svarta är Aa, eftersom ungefär hälften blev vita (aa)."]], ["PKU är recessivt. Båda föräldrarna är bärare. Hur stor risk har varje barn att få sjukdomen?", ["Aa × Aa ger AA, Aa, Aa, aa. Risken är 1 av 4 = 25 %."]], ["En man har sex fingrar, vilket beror på ett dominant anlag. Hans fru och dotter har normalt antal fingrar. Hur stor risk har varje barn att få sex fingrar?", ["Dottern är frisk, så mannen måste vara heterozygot (Ss), inte SS. Ss × ss ger 50 % risk."]], ["Varför drabbas män oftare än kvinnor av X-bundna sjukdomar?", ["Män har bara en X-kromosom. Har den den recessiva allelen finns det inget annat X som kan kompensera. Kvinnor har två X och blir oftast bara anlagsbärare."]], ["Kan en pappa föra över en X-bunden sjukdom till sin son?", ["Nej. Pappan ger sin son en Y-kromosom, inte sitt X. Däremot får alla hans döttrar hans X och blir anlagsbärare."]], ["En kvinna är bärare av Duchennes muskeldystrofi (X-bunden recessiv) och får barn med en frisk man. Hur stor är risken att en dotter blir bärare, och att en son blir sjuk?", ["XᴬXᵃ × XᴬY ger döttrarna XᴬXᴬ eller XᴬXᵃ, alltså 50 % risk att en dotter blir bärare.", "Sönerna blir XᴬY eller XᵃY, alltså 50 % risk att en son blir sjuk."]], ["Varför kan bara honkatter bli sköldpaddsfärgade?", ["Genen för orange eller svart päls sitter på X-kromosomen. En av honans två X-kromosomer inaktiveras slumpvis i varje cell, så vissa fläckar blir orange och andra svarta. Hanar har bara ett X och får en färg."]], ["Hur kan man i en släkttavla se att en sjukdom ärvs autosomalt dominant?", ["Sjukdomen finns i varje generation, drabbar båda könen, och två sjuka föräldrar kan få ett friskt barn. En sjuk pappa kan också få en sjuk son, vilket utesluter X-bunden nedärvning."]]], "mc": [["Vad stämmer för en dominant allel?", ["Den har liten påverkan på fenotypen", "Den ger samma fenotyp hos heterozygoter som hos homozygoter", "Den förs oftare vidare", "Heterozygoter har två av den"], 1, "Det räcker med en dominant allel för att egenskapen ska synas."], ["Tt × Tt. Hur stor andel av avkomman blir tt?", ["0 %", "25 %", "50 %", "75 %"], 1, "Korsningsschemat ger TT, Tt, Tt, tt."], ["Vilket klyvningstal ger Mendels dihybrida korsning GgSs × GgSs?", ["3:1", "1:2:1", "9:3:3:1", "1:1:1:1"], 2, "Två oberoende gener ger 9:3:3:1."], ["Hur stor andel av äggen innehåller en viss X-bunden allel om kvinnan är heterozygot för den?", ["0 %", "25 %", "50 %", "100 %"], 2, "Hälften av äggen får det X som bär allelen."], ["Vilken sjukdom ärvs autosomalt dominant?", ["Cystisk fibros", "PKU", "Huntingtons sjukdom", "Blödarsjuka"], 2, "Huntington, mutation på kromosom 4."], ["Kan en pappa med blödarsjuka föra över den till sin son?", ["Ja, alltid", "Ja, 50 %", "Nej, sonen får hans Y", "Bara om mamman är bärare och han är frisk"], 2, "Sonen får pappans Y-kromosom, inte hans X."], ["En mus med kort svart päls (L_B_) paras med en med lång brun (llbb). Hälften av ungarna får kort päls och alla får svart päls. Vilken genotyp hade den kortpälsade svarta?", ["LLBB", "LlBB", "LlBb", "LLBb"], 1, "Hälften kort → Ll. Alla svarta → BB."]], "ovn": ["korsning", "f_punnett", "slakt", "s_sjuk", "fk_domrec", "fk_xbund"]}, {"id": "p7", "n": 7, "c": "arv", "day": "Tisdag 17/11", "t": "Ofullständig dominans, kodominans, pleiotropi, epistasi och polygen nedärvning", "lasa": [["Lärarens bok (VIVA)", "s. 174–182", "Ofullständig dominans (lejongap och underblomma), kodominans (blodgrupper), sicklecellanemi, epistasi (labrador) och polygen nedärvning (ögonfärg). Gör faktakollen på s. 177 och 182."], ["Biologi Campus", "s. 174–177", "Samma begrepp med hönsens kammar och hudfärg. Läs om du hinner."]], "gissa": ["Två föräldrar med blodgrupp A och B får ett barn med blodgrupp 0. Är det möjligt?", "Ja, om föräldrarna är Iᴬi och Iᴮi. Barnet kan då få i från båda och bli ii, alltså blodgrupp 0. Risken är 25 %."], "guide": ["Skillnaden mellan ofullständig dominans (intermediär nedärvning) och kodominans.", "ABO-blodgrupperna: Iᴬ, Iᴮ och i.", "Pleiotropi, epistasi och polygen nedärvning, med ett exempel på varje.", "Varför sicklecellanemi kan räknas både som recessiv och kodominant."], "punkter": [["Ofullständig dominans ger en mellanform: röd × vit underblomma ger rosa.", ["ofullständig|intermediär|rosa"]], ["Vid kodominans syns båda allelerna, till exempel blodgrupp AB.", ["kodominans"]], ["ABO: Iᴬ och Iᴮ är kodominanta, i är recessiv. Blodgrupp 0 är ii.", ["ia|ib|blodgrupp"]], ["Pleiotropi: en gen påverkar flera egenskaper.", ["pleiotropi"]], ["Epistasi: en gen påverkar uttrycket av en annan, som E-genen hos labrador (ee ger gul päls).", ["epistasi|labrador"]], ["Polygen nedärvning: många gener och miljön påverkar egenskapen, som ögonfärg, hudfärg och längd.", ["polygen"]], ["Sicklecellanemi i heterozygot form ger skydd mot malaria.", ["malaria"]]], "fragor": [["Vad är skillnaden mellan intermediär nedärvning och kodominans?", ["Intermediär: båda allelerna bidrar, och resultatet blir en mellanform. Röd och vit underblomma ger rosa, eftersom den heterozygota plantan bara gör hälften så mycket rött pigment.", "Kodominans: båda allelerna syns samtidigt, utan blandning. Blodgrupp AB har både A- och B-proteinet på de röda blodkropparna."]], ["Vilka genotyper kan en person med blodgrupp A, B, 0 och AB ha?", ["A: IᴬIᴬ eller Iᴬi. B: IᴮIᴮ eller Iᴮi. 0: ii. AB: IᴬIᴮ."]], ["En man är homozygot för blodgrupp A och en kvinna har blodgrupp B. Vilken genotyp är möjlig för deras barn: IᴬIᴬ, ii, Iᴬi eller Iᴮi?", ["Iᴬi. Mannen ger alltid Iᴬ, så barnet kan bli IᴬIᴮ eller Iᴬi, aldrig IᴬIᴬ (kvinnan har ingen Iᴬ), ii eller Iᴮi."]], ["Två ljusrosa lejongap (heterozygoter) korsas. Vilka färger kan avkomman få, och i vilket förhållande?", ["1 mörkrosa : 2 ljusrosa : 1 vit. Vid ofullständig dominans syns heterozygoten som en mellanform."]], ["Varför beskrivs sicklecellanemi ibland som recessiv och ibland som kodominant?", ["Talar man om sjuk eller frisk är den recessiv, bara de med två alleler blir sjuka. Tittar man på blodet hos en heterozygot finns både normala och sickelformade blodkroppar, och då är det kodominans."]], ["Förklara pleiotropi med ett exempel.", ["En gen styr flera egenskaper. Vid fenylketonuri (PKU) fungerar inte genen för ett enzym som omvandlar fenylalanin till tyrosin. Det ger både utvecklingsstörning, kramper och ljusare hår och hud. Ett annat exempel är genen p53."]], ["Förklara epistasi.", ["En gen påverkar hur en annan gen uttrycks. Hos labrador bestämmer B-genen pälsfärgen (svart eller brun), men om hunden är ee för E-genen bildas inget pigment och pälsen blir ljus, oavsett B-genen."]], ["Två svarta labradorer med genotypen BbEe får valpar. Vilka färger kan valparna få, och i vilka proportioner?", ["9 svarta (B_E_) : 3 bruna (bbE_) : 4 gula (__ee). Alla som är ee blir gula oavsett B-genen, eftersom E-genen styr om B-genen uttrycks."]], ["Vad är skillnaden mellan epistasi och polygen nedärvning?", ["Epistasi: en gen påverkar hur en annan gen uttrycks.", "Polygen nedärvning: många gener bidrar tillsammans till en egenskap, ofta med miljöpåverkan."]], ["Varför ger kroppslängd en normalfördelningskurva när man mäter många elever, men blodgrupp bara fyra staplar?", ["Längd är polygen och påverkas dessutom av miljön, så det blir en steglös variation. ABO-blodgruppen styrs av en gen med tre alleler och ger bara fyra fenotyper."]], ["Hur får ögon blå färg?", ["Det finns inget blått pigment. Ögon med lite melanin i regnbågshinnan ser blå ut på grund av hur ljuset sprids. Generna OCA2 och HERC2 på kromosom 15 har stor betydelse, och två recessiva alleler för HERC2 minskar melaninproduktionen."]], ["Två valnötskammade höns (RrPp × RrPp) korsas. Vilka kamformer kan avkomman få?", ["9 valnöt (R_P_) : 3 ros (R_pp) : 3 ärta (rrP_) : 1 enkel (rrpp)."]]], "mc": [["Röd underblomma (AᴿAᴿ) × vit (AⱽAⱽ). Vad blir F1?", ["Alla röda", "Alla vita", "Alla rosa", "Hälften röda, hälften vita"], 2, "Ofullständig dominans ger mellanformen rosa."], ["Rosa × rosa underblomma. Hur stor andel av F2 blir rosa?", ["25 %", "50 %", "75 %", "100 %"], 1, "1 röd : 2 rosa : 1 vit."], ["Vilka blodgrupper kan barnen få om föräldrarna är Iᴬi och Iᴮi?", ["Bara AB", "A och B", "A, B, AB och 0", "Bara 0"], 2, "Alla fyra är möjliga, 25 % var."], ["Vad heter det när en gen påverkar flera egenskaper?", ["Epistasi", "Pleiotropi", "Kodominans", "Polygen nedärvning"], 1, "Pleiotropi."], ["Vilken färg får en labrador med genotypen bbEe?", ["Svart", "Brun", "Gul", "Grå"], 1, "bb ger brun, och E gör att färgen uttrycks."], ["Vilken färg får en labrador med genotypen BBee?", ["Svart", "Brun", "Gul", "Grå"], 2, "ee ger gul päls oavsett B-genen."], ["Vad är vanligast?", ["Monogena egenskaper", "Polygena egenskaper", "Lika vanligt", "Det vet man inte"], 1, "De flesta egenskaper styrs av flera gener."]], "ovn": ["korsning", "s_labrador", "s_nedarv", "s_gtft"]}, {"id": "p8", "n": 8, "c": "epi", "day": "Torsdag 19/11", "t": "Epigenetik, genreglering och heritabilitet", "lasa": [["Biologi Campus", "s. 193–199", "Miljön påverkar hur generna uttrycks. Den här delen finns inte i lärarens bok, så läs i Campus."], ["Lärarens bok (VIVA)", "s. 140", "Repetera hur proteinproduktionen styrs och vad mikroRNA är."]], "gissa": ["Enäggstvillingar har nästan exakt samma gener. Varför har de ändå olika fingeravtryck och kan få olika sjukdomar?", "Miljön påverkar vilka gener som slås på och av och hur mycket de används. Redan i livmodern får tvillingarna lite olika miljö, och sedan lever de olika liv. Det kallas epigenetik."], "guide": ["Den centrala dogmen, och varför samma genotyp ändå kan ge olika fenotyp.", "Genregleringens fyra nivåer.", "Hur DNA-metylering och histonmodifiering fungerar, och vad som påverkar dem.", "Vad heritabilitet är, och vad tvillingstudier kan visa."], "punkter": [["Den centrala dogmen: DNA → RNA → protein.", ["dogm"]], ["Genuttrycket styrs av yttre miljö (sol, höjd, rök) och inre miljö (kost, sömn, stress).", ["miljö", "kost|sömn|stress|sol"]], ["Genregleringen sker på fyra nivåer: epigenetisk, transkriptionell, post-transkriptionell och post-translationell.", ["transkriptionell|nivå"]], ["Epigenetik ändrar genuttrycket utan att ändra DNA:ts bassekvens.", ["epigenetik"]], ["DNA-metylering: metylgrupper vid genens promotor stänger av genen.", ["metyl"]], ["Histonmodifiering: tätt packat DNA (heterokromatin) är svårt att läsa, löst packat (eukromatin) lätt.", ["histon|heterokromatin|eukromatin"]], ["Epigenomet kopieras vid mitos men raderas till största delen när könsceller bildas.", ["epigenom|könscell"]], ["MikroRNA kan blockera mRNA (Nobelpriset 2024).", ["mikrorna|mirna"]], ["Heritabilitet (0–1) anger hur stor del av variationen i en egenskap som beror på arv, i en viss population och miljö.", ["heritabilitet"]]], "fragor": [["Vad innebär genuttryck?", ["Att informationen i en gen förs över till ett protein genom transkription och translation. Genen ”uttrycks”. Vilka gener som uttrycks, och hur mycket, avgör cellens egenskaper."]], ["Vad säger den centrala dogmen, och varför ger samma genotyp ändå inte alltid samma fenotyp?", ["Den centrala dogmen: information går från DNA till RNA till protein. Men vilka gener som används och hur mycket styrs av miljön, så individer med samma genotyp kan få olika fenotyp."]], ["Vilka är genregleringens fyra nivåer?", ["1. Epigenetisk reglering: hur tillgängligt DNA:t är för att läsas av.", "2. Transkriptionell reglering: om och hur mycket mRNA som bildas.", "3. Post-transkriptionell reglering: hur mRNA:t utformas (splitsning) och hur mycket som översätts (mikroRNA).", "4. Post-translationell reglering: proteinerna ändras eller bryts ner."]], ["Förklara hur epigenetiska förändringar påverkar transkriptionen av gener.", ["Vid DNA-metylering binds metylgrupper vid genens promotor, så att reglerande proteiner inte kommer åt och genen stängs av.", "Vid histonmodifiering ändras hur hårt DNA:t är packat runt histonerna. Tätt packat (heterokromatin) är svårt att transkribera, löst packat (eukromatin) lätt."]], ["Vad kan påverka det epigenetiska mönstret?", ["Kost, fysisk aktivitet, rökning, alkohol, läkemedel, sömn, miljögifter och stress. Mönstret förändras också när vi åldras, och påverkas redan under fosterlivet."]], ["Vad är mikroRNA?", ["Korta RNA-molekyler som kan binda till mRNA och blockera det, så att det inte blir något protein. MikroRNA finjusterar genuttrycket. Upptäckten gav Nobelpriset i fysiologi eller medicin 2024."]], ["Vad är heritabilitet? Ge ett exempel på hur den kan förändras.", ["Ett mått mellan 0 och 1 på hur stor del av variationen i en egenskap i en viss population som beror på arv. Heritabiliteten är ofta högre i en god och stabil miljö.", "Exempel: när fler fått tillräckligt med mat har heritabiliteten för längd ökat. Behandling av blödarsjuka har i stället minskat heritabiliteten för sjukdomssymtomen."]], ["Hur kan man ta reda på hur mycket av en egenskap som beror på gener och hur mycket på miljön?", ["Med tvillingstudier: man jämför enäggstvillingar (samma gener) med tvåäggstvillingar. Om enäggstvillingar är mycket mer lika varandra spelar generna stor roll.", "Med adoptionsstudier: man jämför adopterade med både sina biologiska föräldrar (som de delar gener med) och sina adoptivföräldrar (som de delar miljö med)."]], ["Varför blir vissa människor mycket bättre av träning än andra?", ["Ungefär hälften av skillnaden i träningssvar beror på gener. Den som har fördelaktiga genvarianter kan förbättra sig flera gånger mer. Men den som svarar dåligt på en sorts träning kan svara bra på en annan."]]], "mc": [["Vad är epigenetik?", ["Förändringar i DNA:ts bassekvens", "Förändringar som påverkar genuttrycket utan att ändra bassekvensen", "Kromosomavvikelser", "Läran om virus"], 1, "Bassekvensen är densamma, men gener slås av eller på."], ["Vad gör DNA-metylering vid en gens promotor?", ["Startar genen", "Stänger av genen", "Kopierar genen", "Klipper bort genen"], 1, "Metylgrupper hindrar reglerande faktorer från att binda."], ["Hur ser DNA ut som är svårt att transkribera?", ["Löst packat (eukromatin)", "Tätt packat (heterokromatin)", "Enkelsträngat", "Splitsat"], 1, "Tätt packat runt histonerna."], ["Heritabiliteten för en egenskap är 0. Vad betyder det?", ["Allt beror på generna", "All variation beror på miljön", "Egenskapen finns inte", "Egenskapen är dominant"], 1, "0 = all variation i populationen beror på miljön."], ["Vad visade Nobelpriset 2024?", ["Hur CRISPR fungerar", "Hur mikroRNA reglerar gener", "Hur DNA ser ut", "Hur PCR fungerar"], 1, "Ambros och Ruvkun, mikroRNA."]], "ovn": ["f_epi", "o_regl", "s_epimut", "s_regl", "fk_epi"]}, {"id": "p9", "n": 9, "c": "gte", "day": "Torsdag 19/11", "t": "Bioteknik och etik", "lasa": [["Biologi Campus", "s. 208–219", "Läs snabbt: PCR, gentester, GMO, CRISPR och etik. Den här delen finns inte i lärarens bok. Läraren har skrivit ”s. 108–219” i planeringen, troligen menat 208–219, så det kan komma lite om det."]], "gissa": ["Vid ett inbrott hittar polisen ett enda hårstrå. Hur kan så lite DNA räcka för att se vem det kommer från?", "Med PCR-metoden kopieras DNA:t miljontals gånger, tills det finns tillräckligt att analysera. Sedan jämför man vissa delar av DNA:t som skiljer sig mycket mellan människor."], "guide": ["Skillnaden mellan genetik, genteknik och bioteknik.", "PCR-metodens tre steg och temperaturer.", "Vad DNA-teknik används till: fosterdiagnostik, gentester, brottsutredningar och arkeologi.", "Hur man flyttar en gen till en bakterie (hybrid-DNA-teknik).", "Exempel på genmodifierade växter och djur.", "Vad genterapi är, och hur CRISPR-Cas9 fungerar och används."], "punkter": [["Genetik är läran om arvet. Genteknik är metoder för att undersöka och ändra gener. Bioteknik är det bredare begreppet för att använda levande celler tekniskt.", ["genteknik|bioteknik"]], ["PCR kopierar DNA: 95 °C separerar strängarna, vid 50–70 °C binder primers, vid 68–72 °C kopierar DNA-polymeras.", ["pcr", "95|primer"]], ["Med DNA-sekvensering bestämmer man basernas exakta ordning.", ["sekvens"]], ["Gentester och fosterdiagnostik kan visa risk för ärftliga sjukdomar och kromosomavvikelser.", ["gentest|foster"]], ["En DNA-profil från ett brottsplatsspår visar identitet, inte egenskaper.", ["identitet|brott|dna-profil"]], ["Mitokondrie-DNA ärvs från mamman och Y-kromosomen från pappan, och det används för att följa folkvandringar.", ["mitokondri|folkvandring"]], ["Genterapi: en sjuk person får en frisk gen, ofta med virus som bärare, till exempel vid SCID.", ["genterapi"]], ["CRISPR-Cas9 är en gensax från bakteriers immunförsvar (Nobelpris 2020 till Charpentier och Doudna).", ["crispr"]], ["Med CRISPR behandlas i dag talassemi och sicklecellanemi.", ["sicklecell|talassemi"]]], "fragor": [["Vad är skillnaden mellan genetik, genteknik och bioteknik?", ["Genetik: vetenskapen om ärftlighet, genomet och variation.", "Genteknik: metoder för att undersöka och förändra gener och flytta DNA mellan organismer.", "Bioteknik: det bredaste begreppet, att använda levande celler eller delar av celler tekniskt. Det omfattar även genteknik och till exempel jäst i bröd."]], ["Hur fungerar PCR-metoden?", ["1. Provet värms till 95 °C så att DNA-strängarna separeras.", "2. Det svalnar till 50–70 °C så att primers binder.", "3. Vid 68–72 °C bygger DNA-polymeras nya komplementära strängar.", "Cykeln upprepas och DNA-mängden fördubblas varje varv."]], ["Vad kan man använda gentester till?", ["För att bedöma risken för ärftliga sjukdomar som cystisk fibros och Huntingtons sjukdom, i fosterdiagnostik, för att hitta orsaken till infektioner och för att välja läkemedel som passar en persons genotyp."]], ["Vad får polisen veta av en DNA-profil?", ["Bara om provet kommer från en viss person, alltså identitet. Man jämför delar av DNA:t som varierar mycket mellan människor, inte gener för egenskaper."]], ["Hur går en genöverföring med hybrid-DNA-teknik till?", ["Man klipper ut en gen med restriktionsenzymer, sätter in den i en plasmid och för in plasmiden i en bakterie. Bakterien blir då genmodifierad (transgen) och kan till exempel tillverka mänskligt insulin.", "Upptaget av DNA kan underlättas med viruspartiklar som bärare eller med värme- och elchocker."]], ["Ge exempel på genmodifierade växter och djur.", ["Växter: soja, raps, majs och ris, till exempel det gyllene riset som ger mer A-vitamin och järn.", "Djur: kor som ger laktosfri mjölk och får som ger ett protein som behövs vid cystisk fibros.", "Bakterier som tillverkar insulin och tillväxthormon."]], ["Vad är genterapi?", ["En sjuk person får en frisk gen så att sjukdomen lindras eller botas. Ofta används viruspartiklar för att få in genen i cellerna. Exempel: immunbristsjukdomen SCID, en ögonsjukdom som ger blindhet, talassemi och en muskelsjukdom."]], ["Vad är CRISPR-Cas9?", ["En gensax som kommer från bakteriers uråldriga immunförsvar mot virus. Forskare har gjort om den så att den kan klippa och klistra DNA på exakt rätt ställe. Charpentier och Doudna fick Nobelpriset i kemi 2020."]], ["Hur kan CRISPR användas mot sicklecellanemi?", ["Man tar ut blodbildande stamceller från patienten och redigerar en gen så att cellerna gör mer av det hemoglobin som bildas under fosterstadiet. Patienten får då fungerande hemoglobin och slipper blodtransfusioner och smärta."]], ["Vad är skillnaden mellan konsekvensetik, pliktetik och miljöetik?", ["Konsekvensetik (utilitarism): väg för- och nackdelar, målet är så mycket nytta och lycka som möjligt.", "Pliktetik: följ moraliskt grundade regler, även om resultatet i ett enskilt fall blir sämre.", "Miljöetik: organismers naturliga arvsmassa bör inte förändras alls."]], ["Vad innebär försiktighetsprincipen?", ["Den som bedriver en verksamhet ska förebygga och hindra att den skadar människors hälsa eller miljön. En verksamhet kan stoppas även om det inte finns vetenskapliga bevis för att den är skadlig."]]], "mc": [["Vad gör PCR?", ["Klipper DNA", "Kopierar DNA miljontals gånger", "Läser av proteiner", "Sorterar celler"], 1, "Polymerase Chain Reaction, en DNA-kopiator."], ["Vid vilken temperatur separeras DNA-strängarna i PCR?", ["37 °C", "60 °C", "72 °C", "95 °C"], 3, "Vid 95 °C bryts vätebindningarna."], ["Vad är CRISPR-Cas9?", ["Ett virus", "En gensax", "Ett hormon", "En sorts RNA-polymeras"], 1, "En gensax från bakteriers immunförsvar."], ["Vad innebär försiktighetsprincipen?", ["Man måste bevisa skada innan något stoppas", "En verksamhet kan stoppas om den kan skada, även utan säkra bevis", "Man ska alltid välja det billigaste", "Man följer moraliska regler"], 1, "Förebygg skada på hälsa och miljö."]], "ovn": ["o_pcr", "o_hybrid", "f_pcr", "s_tek", "s_etik", "etik"]}, {"id": "p10", "n": 10, "c": "cel", "day": "Extra – när det passar", "t": "Extra: celler, bakterier och virus", "lasa": [["Biologi Campus", "s. 132–145", "Celler och virus. Finns inte i lärarens planering för det här provet, men i föreläsningen och begreppslistan. Skumma igenom om du hinner."]], "gissa": ["Varför hjälper antibiotika mot halsfluss men inte mot förkylning?", "Halsfluss orsakas av bakterier, förkylning av virus. Antibiotika angriper delar som bara bakterier har, till exempel cellväggen. Virus saknar sådana delar."], "guide": ["Prokaryota och eukaryota celler och deras delar.", "Bakteriers uppbyggnad och förökning, antibiotikaresistens.", "Virus uppbyggnad och förökning."], "punkter": [["Prokaryoter (bakterier och arkéer) saknar cellkärna. Eukaryoter har cellkärna och organeller.", ["prokaryot|eukaryot"]], ["Bakterier har cellvägg, en ringformad kromosom, plasmider, ribosomer och ibland flageller och fimbrier.", ["plasmid|cellvägg"]], ["Bakterier förökar sig genom binär fission.", ["binär"]], ["Antibiotikaresistens uppstår när bakterier som tål antibiotika överlever och förökar sig.", ["resistens"]], ["Virus består av arvsmassa i en kapsid och kan bara föröka sig i en värdcell.", ["kapsid|värdcell"]]], "fragor": [["Vad är skillnaden mellan prokaryota och eukaryota celler?", ["Prokaryota celler (bakterier och arkéer) saknar cellkärna och organeller med membran. DNA:t ligger fritt i en ringformad kromosom, ofta med plasmider. Eukaryota celler har cellkärna och organeller och är oftast mycket större."]], ["Vad är en plasmid?", ["En liten ringformad DNA-molekyl i bakterier, utanför kromosomen. Den kan bära gener för till exempel antibiotikaresistens och kan överföras mellan bakterier."]], ["Hur uppstår antibiotikaresistens?", ["När bakterier utsätts för antibiotika dör de känsliga. Bakterier som av en slump har en mutation eller ett gen som ger skydd överlever och förökar sig. Gener för resistens kan också spridas med plasmider. Onödig antibiotikaanvändning snabbar på processen."]], ["Beskriv hur ett virus förökar sig.", ["Viruset fäster vid en värdcell och för in sin arvsmassa. Cellen tillverkar nya virusproteiner och kopierar arvsmassan. Nya virus sätts ihop och släpps ut, ofta så att cellen dör."]], ["Varför räknas virus oftast inte som levande?", ["De är inte celler, har ingen egen ämnesomsättning och kan bara föröka sig i en värdcell."]]], "mc": [["Vad saknar prokaryota celler?", ["Ribosomer", "Cellkärna", "DNA ie, djur- och växtcell eller virus?", "cel", ["Bakterie (prokaryot)", "Djur- och växtcell (eukaryot)", "Virus"], [["Saknar cellkärna men är en cell", 0], ["Har plasmider", 0], ["Förökar sig med binär fission", 0], ["Kan behandlas med antibiotika", 0], ["Har cellkärna", 1], ["Har mitokondrier", 1], ["Förökar sig med mitos", 1], ["Kan bara föröka sig i en värdcell", 2], ["Arvsmassan sitter i en kapsid", 2], ["Har ingen egen ämnesomsättning", 2]]]}, "EXPLAIN": {"fk_mitmei": ["Mitos och meios", "del", "Förklara skillnaden mellan mitos och meios för någon som är 12 år.", [["två"], ["fyra"], ["identisk", "likadan", "lika"], ["könscell", "ägg", "spermie"], ["46"], ["23", "halva", "hälften"]], "Mitos är vanlig celldelning: en cell blir två likadana celler med 46 kromosomer var. Det behövs när du växer eller när ett sår läker. Meios gör ägg och spermier: cellen delar sig två gånger och det blir fyra celler med bara 23 kromosomer, och alla blir olika."], "fk_telomer": ["Telomerer", "del", "Förklara vad telomerer är och varför de har med åldrande att göra.", [["kromosom"], ["ände", "ändar", "änden"], ["kort"], ["delning", "delar sig"], ["åldr", "gammal"]], "Telomerer är som plastskydden på ett skosnöre, fast på kromosomernas ändar. Varje gång cellen delar sig blir de lite kortare. När de blir för korta slutar cellen dela sig, och det är en del av förklaringen till att vi åldras."], "fk_domrec": ["Dominant och recessiv", "arv", "Förklara varför två föräldrar utan en egenskap kan få ett barn med egenskapen.", [["dominant"], ["recessiv"], ["bärare", "anlagsbärare"], ["två", "båda", "dubbel"], ["25", "1/4", "en på fyra", "fjärdedel"]], "Båda föräldrarna bär på en recessiv allel som inte syns, eftersom de också har en dominant allel. Om barnet får den recessiva allelen från båda föräldrarna syns egenskapen. Chansen är 25 % för varje barn."], "fk_xbund": ["X-bundna sjukdomar", "arv", "Förklara varför färgblindhet är så mycket vanligare hos killar än tjejer.", [["x-kromosom", "x"], ["bara ett", "ett x", "en x"], ["recessiv"], ["två", "andra x"], ["bärare"]], "Genen sitter på X-kromosomen och allelen för färgblindhet är recessiv. Killar har bara ett X, så har det X:et allelen blir de färgblinda. Tjejer har två X, och det andra X:et har oftast en normal allel, så de blir bara bärare."], "fk_prot": ["Proteinsyntesen", "dna", "Förklara hur en gen blir till ett protein, steg för steg.", [["transkription"], ["mrna"], ["kärna", "kärnan"], ["ribosom"], ["trna"], ["kodon"], ["aminosyr"], ["translation"]], "I cellkärnan kopieras genen till mRNA (transkription). mRNA:t åker ut till en ribosom. Ribosomen läser mRNA:t tre baser åt gången, ett kodon. tRNA kommer med rätt aminosyra till varje kodon, och aminosyrorna kopplas ihop till en kedja (translation). Kedjan veckas till ett färdigt protein."], "fk_epi": ["Epigenetik", "epi", "Förklara vad epigenetik är och ge ett exempel från vardagen.", [["gen"], ["miljö"], ["av", "på"], ["sekvens", "ändrar inte", "inte dna"], ["metyl", "histon"]], "Epigenetik betyder att miljön kan slå av eller på gener utan att själva DNA-koden ändras. Det sker till exempel genom att små metylgrupper fäster vid DNA:t eller att DNA:t packas tätare. Mat, sömn, träning, stress och rökning kan påverka det."], "fk_pcr": ["PCR", "gte", "Förklara hur PCR fungerar och varför polisen har nytta av det.", [["kopi"], ["95", "värm"], ["primer"], ["polymeras"], ["fördubbl", "miljon"]], "PCR är en DNA-kopiator. Man värmer provet så att DNA-strängarna släpper från varandra, kyler så att små startbitar (primers) fäster, och låter enzymet DNA-polymeras bygga nya strängar. Varje varv fördubblar mängden, så efter en stund finns miljontals kopior. Då räcker ett hårstrå för att göra en DNA-profil."], "fk_crispr": ["CRISPR", "gte", "Förklara vad CRISPR är och ge ett exempel på vad det används till.", [["sax", "klipp"], ["bakteri"], ["exakt", "rätt ställe", "specifik"], ["sicklecell", "talassemi", "sjukdom"]], "CRISPR-Cas9 är en gensax som bakterier använde const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.setAttribute('style', v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const mix = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const kc = k => 'k-' + k;
const norm = s => (s || '').toLowerCase().replace(/[’']/g, "'");
function hasKw(text, alt) { const t = norm(text); return alt.split('|').some(a => t.includes(norm(a))); }

  speechSynthesis.cancel();

const LS = 'edgar-prov2-v3';
let S = { v: 1, u: 0, q: {}, t: {}, ck: {}, cards: {}, last: '' };
try { const raw = localStorage.getItem(LS); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
let dbRef = null, syncMode = 'local', saveTimer = null, writing = false, pending = false;
function save() {
  S.u = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  if (dbRef) { clearTimeout(saveTimer); saveTimer = setTimeout(pushDb, 1500); }
}
async function pushDb() {
  if (!dbRef) return;
  if (writing) { pending = true; return; }
  writing = true;
  try { await dbRef.set({ json: JSON.stringify(S), u: S.u }); } catch (e) { if (e && (e.code === 'not_granted' || e.code === 'invalid_argument')) { dbRef = null; syncMode = 'local'; updSync(); } }
  writing = false;
  if (pending) { pending = false; pushDb(); }
}
function updSync() {
  document.querySelectorAll('.sync').forEach(s => s.textContent = syncMode === 'db'
    ? 'Dina svar sparas i ditt Claude-konto och följer med mellan dina enheter.'
    : 'Dina svar sparas på den här enheten.');
}
(async function initDb() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc('data/users/' + id + '/prov2');
    const snap = await ref.get();
    dbRef = ref; syncMode = 'db';
    if (snap.exists) {
      const d = snap.data(); let remote = null;
      try { remote = JSON.parse(d.json); } catch (e) {}
      if (remote && (remote.u || 0) > (S.u || 0)) { S = Object.assign({ q: {}, t: {}, ck: {}, cards: {} }, remote); try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} render(); }
      else if ((S.u || 0) > (remote ? remote.u || 0 : 0)) pushDb();
    } else if (S.u) pushDb();
    updSync();
  } catch (e) { dbRef = null; syncMode = 'local'; }
})();

/* ===================== Data ===================== */
const PASS = {}; D.PASSES.forEach(p => PASS[p.id] = p);
const Q = {}; // id -> {id, pass, q, a}
D.PASSES.forEach(p => (p.fragor || []).forEach((f, i) => { const id = p.id + '-' + (i + 1); Q[id] = { id, pass: p.id, q: f[0], a: f[1] }; }));
const passQs = pid => Object.values(Q).filter(x => x.pass === pid);

function weight(id, unseenW) {
  const r = S.q[id];
  if (!r) return unseenW;
  const days = (Date.now() - (r.at || 0)) / 864e5;
  return [0.6 + Math.min(days, 10) * 0.15, 3, 5][r.s];
}
function pickWeighted(ids, n, unseenW) {
  const pool = ids.map(id => ({ id, w: weight(id, unseenW) * (0.6 + Math.random() * 0.8) }));
  pool.sort((a, b) => b.w - a.w);
  return pool.slice(0, n).map(x => x.id);
}

  const labels = ['Kunde', 'Osäker', 'Kunde inte'];
  const gb = labels.map((l, g) => el('button', { class: 'g' + g + ((S.q[id] && S.q[id].s === g) ? ' on' : ''), onclick: () => {

  } }, l));
  grade.append(el('span', { class: 'soft small', text: 'Hur gick det?' }), ...gb);

/* ===================== Drag-hjälp ===================== */
function dragChip(c, selector, onDrop, onTap) {
  let sx, sy, ghost = null, moved = false;
  c.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; moved = false; try { c.setPointerCapture(e.pointerId); } catch (_) {} });
  c.addEventListener('pointermove', e => {
    if (sx === undefined) return;
    if (!ghost && Math.hypot(e.clientX - sx, e.clientY - sy) > 6) { ghost = c.cloneNode(true); ghost.classList.add('ghost', 'sel'); document.body.appendChild(ghost); moved = true; }
    if (ghost) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; }
  });
  c.addEventListener('pointerup', e => { if (ghost) { const t = document.elementFromPoint(e.clientX, e.clientY); const z = t && t.closest(selector); ghost.remove(); ghost = null; if (z) onDrop(c, z); } sx = undefined; });
  c.addEventListener('pointercancel', () => { if (ghost) { ghost.remove(); ghost = null; } sx = undefined; });
  c.addEventListener('click', () => { if (moved) { moved = false; return; } onTap(c); });
}

}

function viewBegrepp() {
  const v = el('div');
  v.append(topnav('begrepp'), el('h1', { text: 'Begrepp' }), el('p', { class: 'soft', text: 'Begreppen från klassens lista och böckerna, med korrekta förklaringar.' }));
  const r = el('details', { class: 'card' }, el('summary', null, el('b', { text: '⚠️ Rättelser till klassens begreppslista (' + D.RATT.length + ' st)' })),
    el('p', { class: 'small soft', text: 'De här förklaringarna i listan som klassen skrivit stämmer inte. Lär dig den rättade versionen.' }),
    ...D.RATT.map(([t, fel, ratt]) => el('div', { class: 'term k-epi' }, el('h3', { text: t }), el('p', { class: 'exm', text: 'I listan: ' + fel }), el('p', null, el('b', { text: 'Rätt: ' }), ratt))));
  v.append(r);
  const card = el('div', { class: 'card' });
  const filt = el('div', { class: 'tabs' }), modes = el('div', { class: 'tabs' }), body = el('div');
  let g = null, mode = 'list';
  const B = () => D.B.filter(b => !g || b[3] === g);
  [['Alla', null]].concat(Object.entries(GN).map(([k, n]) => [n, k])).forEach(([n, k]) => filt.append(el('button', { class: k ? kc(k) : '', onclick: () => { g = k; draw(); } }, n)));
  [['list', 'Läs listan'], ['match', 'Para ihop'], ['guess', 'Gissa begreppet'], ['card', 'Begreppskort']].forEach(([k, n]) => modes.append(el('button', { onclick: () => { mode = k; draw(); } }, n)));
  const draw = () => {
    [...filt.children].forEach((b, k) => b.setAttribute('aria-pressed', (k === 0 ? g === null : Object.keys(GN)[k - 1] === g) ? 'true' : 'false'));
    [...modes.children].forEach((b, k) => b.setAttribute('aria-pressed', ['list', 'match', 'guess', 'card'][k] === mode ? 'true' : 'false'));
    body.innerHTML = ''; ({ list: bList, match: bMatch, guess: bGuess, card: bCards })[mode](body, B());
  };
  card.append(el('p', { class: 'small soft', style: 'margin:0', text: 'Område' }), filt, el('p', { class: 'small soft', style: 'margin:0', text: 'Läge' }), modes, body);
  v.append(card); draw();
  return v;
}
